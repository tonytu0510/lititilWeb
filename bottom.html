<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shanna.Li">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>天地人日 · 底层逻辑</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./common.css">
    <script src="./dino-game.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5efe8;
            font-family: 'Courier New', monospace;
        }
        .wrap{
            display: flex;
            justify-content: center;
            align-items: center;
            width:100%;
            height: calc(100vh - 50px);
        }
        .container {
            background: #fcf9f6;
            border-radius: 16px;
            padding: 30px 32px;
            border: 1px solid #cebcae;
            box-shadow: 0 8px 28px rgba(0,0,0,0.2);
            max-width: 600px;
            min-height: 300px;
        }
        .title {
            color: #2d241e;
            font-size: 22px;
            letter-spacing: 6px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 16px;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .title span {
            color: #7cb8b8;
        }
        .sub {
            color: #555;
            font-size: 12px;
            text-align: center;
            margin-top: -12px;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }
        .path {
            background: #0f0f0f;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 12px;
            border-left: 3px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .path .label {
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
            width: 50px;
            flex-shrink: 0;
        }
        .path .value {
            color: #d0d0d0;
            font-size: 20px;
            letter-spacing: 4px;
            font-family: 'Georgia', serif;
        }
        .path .arrow {
            color: #444;
            font-size: 16px;
            margin: 0 2px;
        }
        .path .highlight {
            color: #7cb8b8;
        }
        .path .highlight2 {
            color: #e8a838;
        }
        .path .highlight3 {
            color: #c87a7a;
        }
        .divider {
            border-top: 1px dashed #2a2a2a;
            margin: 16px 0;
        }
        .final {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 18px 20px;
            text-align: center;
            border: 1px solid #2a2a2a;
            margin-top: 8px;
        }
        .final .big {
            font-size: 48px;
            color: #7cb8b8;
            letter-spacing: 16px;
            font-family: 'Georgia', serif;
        }
        .final .big span {
            color: #e8a838;
        }
        .final .big .last {
            color: #c87a7a;
        }
        .final .desc {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .foot {
            color: #444;
            font-size: 11px;
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #1a1a1a;
            padding-top: 14px;
            letter-spacing: 1px;
        }
        .foot span {
            color: #7cb8b8;
        }
        @media (max-width: 480px) {
            .path .value { font-size: 16px; }
            .final .big { font-size: 36px; letter-spacing: 10px; }
        }
        /* ===== 顶部三菜单（超链接导航） ===== */
        .menu-bar {
            display: flex;
            justify-content: space-around;
            background: #e7ddd2;
            border-radius: 50px;
            padding: 0.5rem 0.3rem;
            margin-bottom: 1.8rem;
            border: 1px solid #cebcae;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            margin: 30px auto;
            max-width: 700px;
        }
        .menu-bar a {
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            color: #2d241e;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            transition: 0.15s;
            letter-spacing: 1px;
            background: transparent;
        }
        .menu-bar a:hover {
            background: #d1c1b2;
        }
        .menu-bar a:active {
            opacity: 0.5;
        }
        /* 当前页面高亮（示例：第一个菜单为当前页） */
        .menu-bar a.current {
            background: #b8a08b;
            color: #fcf9f6;
        }
        /* 手机极端小屏优化 */
        @media (max-width: 420px) {
            .menu-bar a { font-size: 0.9rem; padding: 0.2rem 0.6rem; }
            .tab-btn { font-size: 0.95rem; padding: 0.3rem 0.4rem; }
            .entry .char { font-size: 1.5rem; min-width: 1.8rem; }
            .entry .def { font-size: 0.85rem; }
            .menu-bar{margin-top: 4rem;}
        }
    </style>
</head>
<body>
<div id="topBarContainer"></div>
<!-- ===== 顶部三菜单（超链接） ===== -->
<div class="menu-bar">
    <a href="fontAll.html">拆字首页</a>
    <a href="font.html">拆字推演</a>
    <a href="splitFont.html">拆字宇宙</a>
    <a href="bottom.html" class="current">底层推导</a>
    <a href="risk.html">风险 · RISK</a>
    <!-- 您可以把 # 替换成您网站的实际链接，例如 /index.html 、 /ziku.html 、 /bingge.html -->
</div>
<div class="wrap">
<div class="container">
    <div class="title">⬡ 天地人日 · <span>底层</span></div>
    <div class="sub">字形拆解 · 还原笔画的原始状态</div>

    <!-- 路径展示 -->
    <div class="path">
        <span class="label">起点</span>
        <span class="value">天 地 人 日</span>
        <span class="arrow">→</span>
        <span class="value highlight">三 门 峡</span>
    </div>

    <div class="path">
        <span class="label">拆解</span>
        <span class="value">三 门 閊 山 卜 天 艹</span>
        <span class="arrow">→</span>
        <span class="value highlight2">三门峡</span>
    </div>

    <div class="path">
        <span class="label">剥离</span>
        <span class="value">三 门 卜 天 艹</span>
        <span class="arrow">→</span>
        <span class="value">二 门 卜 王 艹</span>
        <span class="arrow">→</span>
        <span class="value">门 卜 王 艹</span>
    </div>

    <div class="path">
        <span class="label">继续</span>
        <span class="value">卜 丨</span>
        <span class="arrow">→</span>
        <span class="value highlight2">卜 王 艹</span>
        <span class="arrow">→</span>
        <span class="value highlight3">王 艹</span>
    </div>

    <div class="path">
        <span class="label">最终</span>
        <span class="value">三 丨 一 丨 丨</span>
        <span class="arrow">→</span>
        <span class="value">一 丨 一 丨 丨</span>
        <span class="arrow">→</span>
        <span class="value highlight">丨</span>
    </div>

    <div class="divider"></div>

    <!-- 对合 -->
    <div class="path">
        <span class="label">对合</span>
        <span class="value">三门峡</span>
        <span class="arrow">⟷</span>
        <span class="value highlight2">常州</span>
    </div>

    <div class="divider"></div>

    <!-- 底层结论 -->
    <div class="final">
        <div class="big">
            <span>一</span> <span>丨</span> <span class="last">十</span>
        </div>
        <div class="desc">天地人日 · 最后拆到底 · 只剩横竖交叉</div>
    </div>

    <div class="foot">
        <span>拆到尽头 · 还原为原始笔画</span>
    </div>
</div>
</div>
<script src="./common.js"></script>
</body>
</html>
