<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>通假 · 同音候选工具</title>
<style>
  body {
    background: #1a1a1a;
    color: #ddd;
    font-family: 'Courier New', monospace;
    margin: 0;
    padding: 20px;
    line-height: 1.7;
  }
  h1 { font-size: 18px; color: #7cb8b8; margin: 0 0 4px 0; }
  .sub { color: #666; font-size: 12px; margin-bottom: 20px; }
  .panel {
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  input {
    width: 200px;
    background: #0d0d0d;
    color: #ddd;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 10px;
    font-family: inherit;
    font-size: 18px;
    text-align: center;
    letter-spacing: 4px;
  }
  button {
    background: #2a2a2a;
    color: #ddd;
    border: 1px solid #555;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    margin-left: 8px;
  }
  button:hover { background: #3d3d3d; }
  button.primary { background: #7cb8b8; color: #0d0d0d; border-color: #7cb8b8; }
  button.primary:hover { background: #8fc8c8; }
  pre {
    background: #0d0d0d;
    padding: 14px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.7;
    overflow-x: auto;
    color: #b0d0d0;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .step { color: #7cb8b8; font-weight: bold; }
  .hit { color: #f9ed69; }
  .yue { color: #9c9; font-weight: bold; }
  .duo { color: #e88; }
  .yan { color: #7cb8b8; }
  .plain { color: #888; }
  .warn { color: #e88; }
  .rare { color: #555; font-size: 11px; }
  .candidate {
    display: inline-block;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 2px 8px;
    margin: 2px;
    font-size: 15px;
  }
  .candidate.yue { background: #1a3320; border-color: #9c9; }
  .candidate.yan { background: #1a2a33; border-color: #7cb8b8; }
  .candidate.both { background: #332a1a; border-color: #f9ed69; }
  .candidate.rare { opacity: 0.5; }
  .chain { color: #b0d0d0; }
  .chain-yue { color: #9c9; font-weight: bold; background: #1a3320; padding: 0 4px; border-radius: 3px; }
  .blank {
    color: #f9ed69;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .blank-input {
    background: #0d0d0d;
    border: 1px dashed #f9ed69;
    color: #f9ed69;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 15px;
    width: 120px;
    text-align: center;
    letter-spacing: 4px;
  }
  .blank-input:focus {
    outline: none;
    border-color: #7cb8b8;
    color: #7cb8b8;
  }
</style>
</head>
<body>

<h1>通假 · 同音候选工具</h1>
<div class="sub">单音字 → 古音/通假 → 同音字 → 筛含曰/月/言 → 展开拆解链 → 拆到曰什么（留白）</div>

<div class="panel">
  <input id="input" value="原" maxlength="1">

// ============================================================
// 工具函数
// ============================================================
function stripTone(pinyin) {
  const map = {
    'ā':'a','á':'a','ǎ':'a','à':'a',
    'ē':'e','é':'e','ě':'e','è':'e',
    'ī':'i','í':'i','ǐ':'i','ì':'i',
    'ō':'o','ó':'o','ǒ':'o','ò':'o',
    'ū':'u','ú':'u','ǔ':'u','ù':'u',
    'ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v',
    'ń':'n','ň':'n','ǹ':'n'
  };
  let out = '';
  for (const c of pinyin) out += map[c] || c;
  return out;
}

// 递归判断字里是否含某个目标部件
function containsPart(char, target, depth) {
  depth = depth || 0;
  if (depth > 10) return false;
  if (char === target) return true;
  if (CHAR_SPLIT[char]) {
    const parts = CHAR_SPLIT[char];
    for (let i = 0; i < parts.length; i++) {
      if (parts[i] === char) continue;
      if (containsPart(parts[i], target, depth + 1)) return true;
    }
  }
  return false;
}

function containsYue(char) {
  return containsPart(char, '曰') || containsPart(char, '月');
}

function containsYan(char) {
  return containsPart(char, '言') || containsPart(char, '讠');
}

function isRare(char) {
  return !COMMON_CHARS.has(char);
}

// ============================================================
// 展开拆解链（带缩进）
// ============================================================
function expandChain(char, depth, lines, parentPrefix) {
  depth = depth || 0;
  lines = lines || [];
  parentPrefix = parentPrefix || '';
  if (depth > 8) return lines;

  const parts = CHAR_SPLIT[char];
  if (!parts) {
    lines.push(parentPrefix + char + ' （无拆解）');
    return lines;
  }

  parts.forEach(function(part, i) {
    const isLast = i === parts.length - 1;
    const branch = isLast ? '└─ ' : '├─ ';
    const nextPrefix = parentPrefix + (isLast ? '   ' : '│  ');

    // 如果 part 是「曰」，高亮
    const isYue = part === '曰';
    const isYan = part === '言' || part === '讠';
    let mark = '';
    if (isYue) mark = ' <span class="chain-yue">← 出现曰</span>';
    else if (isYan) mark = ' <span class="yan">← 言字旁</span>';

    lines.push(parentPrefix + branch + part + mark);
    // 继续展开
    if (CHAR_SPLIT[part] && part !== char) {
      expandChain(part, depth + 1, lines, nextPrefix);
    }
  });

  return lines;
}

// 找「曰」后面跟的部件（在拆解链里，曰的下一个兄弟节点）
function findYueNext(char, depth) {
  depth = depth || 0;
  if (depth > 10) return null;

  const parts = CHAR_SPLIT[char];
  if (!parts) return null;

  // 看这一层有没有曰
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === '曰') {
      // 曰后面的兄弟
      if (i + 1 < parts.length) return parts[i + 1];
      // 曰是最后一个，返回「一」作为默认（言=曰+一）
      return '一';
    }
  }

  // 递归查子层
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === char) continue;
    const r = findYueNext(parts[i], depth + 1);
    if (r) return r;
  }

  return null;
}

// 找「言」出现的位置
function findYan(char, depth) {
  depth = depth || 0;
  if (depth > 10) return null;
  const parts = CHAR_SPLIT[char];
  if (!parts) return null;
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === '言' || parts[i] === '讠') return parts[i];
  }
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === char) continue;
    const r = findYan(parts[i], depth + 1);
    if (r) return r;
  }
  return null;
}

// ============================================================
// 主流程
// ============================================================
function run() {
  const char = document.getElementById('input').value.trim();
  const log = [];

  if (!char) {
    document.getElementById('output').textContent = '请输入一个字';
    return;
  }

  log.push('<span class="step">【输入】</span>');
  log.push('  ' + char);

  // 第1步：现代读音
  log.push('');
  log.push('<span class="step">【第1步：现代读音】</span>');
  const modern = DUOYIN_MODERN[char] || null;
  if (modern) {
    log.push('  现代读音：' + modern.join(' / ') + (modern.length > 1 ? '  （多音字）' : '  （单音字）'));
  } else {
    log.push('  <span class="warn">（现代读音表里没有收录，当作单音字处理）</span>');
  }

  // 第2步：古音/通假
  log.push('');
  log.push('<span class="step">【第2步：古音/通假异读】</span>');
  const ancient = ANCIENT_READ[char] || [];
  if (ancient.length === 0) {
    log.push('  <span class="warn">（没有收录古音/通假）</span>');
  } else {
    ancient.forEach(function(a) {
      log.push('  ' + char + ' → ' + a.pinyin + '  ' + a.note + '  ' + a.source);
    });
  }

  // 第3步：同音字
  log.push('');
  log.push('<span class="step">【第3步：按读音列同音字】</span>');

  const allPinyin = [];
  if (modern) modern.forEach(function(p) { allPinyin.push({ pinyin: p, from: '现代' }); });
  ancient.forEach(function(a) { allPinyin.push({ pinyin: a.pinyin, from: '古音/通假' }); });

  if (allPinyin.length === 0) {
    log.push('  <span class="warn">（没有读音可用）</span>');
    document.getElementById('output').innerHTML = log.join('\n');
    return;
  }

  const seenPinyin = {};
  const uniquePinyin = [];
  allPinyin.forEach(function(p) {
    const key = stripTone(p.pinyin);
    if (!seenPinyin[key]) {
      seenPinyin[key] = true;
      uniquePinyin.push(p);
    }
  });

  uniquePinyin.forEach(function(p) {
    const key = stripTone(p.pinyin);
    const list = TONGYIN[key] || [];
    log.push('  ' + p.pinyin + '（' + p.from + '）→ ' + list.length + ' 个同音字');
    if (list.length) {
      log.push('    ' + list.join(' '));
    }
  });

  // 第4步：筛含曰/月/言
  log.push('');
  log.push('<span class="step">【第4步：筛含「曰/月/言字旁」的字】</span>');

  const candidates = [];
  uniquePinyin.forEach(function(p) {
    const key = stripTone(p.pinyin);
    const list = TONGYIN[key] || [];
    list.forEach(function(c) {
      if (c === char) return;
      const yue = containsYue(c);
      const yan = containsYan(c);
      if (yue || yan) {
        candidates.push({
          char: c,
          pinyin: p.pinyin,
          from: p.from,
          yue: yue,
          yan: yan,
          rare: isRare(c)
        });
      }
    });
  });

  if (candidates.length === 0) {
    log.push('  <span class="warn">（没有找到含曰/月/言字旁的同音字）</span>');
  } else {
    log.push('  候选：');
    candidates.forEach(function(c) {
      let tag = '';
      if (c.yue && c.yan) tag = '【曰+言】';
      else if (c.yue) tag = '【曰/月】';
      else if (c.yan) tag = '【言】';
      let cls = 'candidate';
      if (c.yue && c.yan) cls += ' both';
      else if (c.yue) cls += ' yue';
      else if (c.yan) cls += ' yan';
      if (c.rare) cls += ' rare';
      log.push('    <span class="' + cls + '">' + c.char + '</span> ' + tag +
        '  （' + c.pinyin + '，' + c.from + '）' +
        (c.rare ? ' <span class="rare">[生僻]</span>' : ''));
    });
  }

  // ---------- 第5步：展开拆解链 ----------
  if (candidates.length > 0) {
    log.push('');
    log.push('<span class="step">【第5步：展开候选字的拆解链】</span>');

    // 用第一个候选（或所有候选）展开
    candidates.forEach(function(c) {
      log.push('');
      log.push('  <span class="hit">▸ ' + c.char + '</span> 拆解：');

      const lines = [];
      // 顶行
      lines.push('  ' + c.char);
      expandChain(c.char, 1, lines, '  ');
      log.push(lines.join('\n'));

      // 找曰后面跟什么
      const yueNext = findYueNext(c.char);
      const yanPart = findYan(c.char);

      log.push('');
      if (yueNext) {
        log.push('  <span class="yue">「曰」后面的部件：</span>' + yueNext);
        log.push('');
        log.push('  <span class="blank">请填空：曰 ' + yueNext + ' = ？</span>');
        log.push('  <span class="plain">（这里就是「曰什么」，留白，自己填）</span>');
      } else if (yanPart) {
        // 只有言，没有曰（言本身拆出来应该有曰）
        log.push('  <span class="yan">「' + yanPart + '」字旁</span>');
        log.push('  拆「' + yanPart + '」：' + (CHAR_SPLIT[yanPart] ? CHAR_SPLIT[yanPart].join(' + ') : '（无拆解）'));
        log.push('');
        log.push('  <span class="blank">请填空：曰 ____</span>');
        log.push('  <span class="plain">（这里就是「曰什么」，留白，自己填）</span>');
      } else {
        log.push('  <span class="warn">（没有找到曰）</span>');
      }
    });
  }

  // 结论
  log.push('');
  log.push('<span class="step">【结论】</span>');
  if (candidates.length === 0) {
    log.push('  <span class="warn">没有候选，这条路走不通。</span>');
  } else {
    log.push('  共 ' + candidates.length + ' 个候选。');
    log.push('  已展开拆解链，标出了「曰」的位置。');
    log.push('  <span class="blank">剩下的「曰什么」，留白，自己填。</span>');
  }

  document.getElementById('output').innerHTML = log.join('\n');
}

// ============================================================

  '说': ['shuō', 'shuì', 'yuè'],
  '曰': ['yuē'],
  '月': ['yuè'],
  '明': ['míng'],
  '谅': ['liàng'],
  '信': ['xìn'],
  '心': ['xīn'],
  '身': ['shēn'],

  '长': ['cháng', 'zhǎng'],
  '好': ['hǎo', 'hào'],
  '尽': ['jǐn', 'jìn'],
  '禁': ['jīn', 'jìn'],
  '劲': ['jìn', 'jìng'],
  '仅': ['jǐn', 'jìn'],
  '京': ['jīng'],
  '金': ['jīn'],
  '一': ['yī'],
  '以': ['yǐ'],
  '之': ['zhī'],
  '王': ['wáng', 'wàng'],
  '知': ['zhī', 'zhì'],
  '见': ['jiàn', 'xiàn'],

// ============================================================
// 事件
// ============================================================
document.getElementById('btnRun').addEventListener('click', run);
document.getElementById('btnClear').addEventListener('click', function() {
  document.getElementById('input').value = '';
  document.getElementById('output').textContent = '等待输入…';
});

run();
</script>
