<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="./js/meta-config.js"></script>
  <script>
    window.PAGE_META.title = "规则压缩与还原 · 示例版"
    window.PAGE_META.cssFront = ["./css/compress.css"]
    window.PAGE_META.jsEnd = ["./js/compress.js"]
  </script>
  </style>
  <script>
    window.PAGE_META.content =
    `
    <div class="wrap">

      <div class="tag">技术设想 · 示例版</div>

      <h1>
        规则压缩与还原<br>
        <span class="hl">示例版</span>
      </h1>

      <p class="sub">
        压缩逻辑做成一个 JS 方法，命名 compressMethod。<br>
        前端只调它，规则写在页面上，不碰服务端。
      </p>

      <div class="section-title">一、输入原文</div>
      <div class="panel">
        <label>原文</label>
        <textarea id="inputText">今天天气不错，市场跑起来，政府兜住底，让敢干的人有路走。</textarea>
        <div class="hint">输入任意文字，点“压缩”试试。</div>
      </div>

      <div class="btns">
        <button class="gold" onclick="runCompress()">压缩</button>
        <button class="green" onclick="runRestore()">还原</button>
        <button onclick="clearAll()">清空</button>
      </div>

      <div class="section-title">二、压缩结果（短码）</div>
      <div class="panel">
        <label>短码</label>
        <textarea id="codeText" placeholder="压缩后，短码会出现在这里"></textarea>
        <div class="hint">短码 + 规则 = 可还原。</div>
      </div>

      <div class="section-title">三、还原结果（原文）</div>
      <div class="panel">
        <label>还原原文</label>
        <textarea id="outputText" placeholder="还原后，原文会出现在这里"></textarea>
        <div class="hint">当前为示例版，还原逻辑可替换。</div>
      </div>

      <div class="section-title">四、规则说明（示例）</div>
      <div class="panel">
        <div class="rule-box">
          <div><span class="hl">核心等式：</span>一 = 丨 = 空 = 0</div>
          <div><span class="hl">压缩：</span>取原文每个字，按偏旁部首拆</div>
          <div><span class="hl">归约：</span>横归一，竖归丨，弯/圈/点归0</div>
          <div><span class="hl">再归约：</span>一、丨、0 统一转成空</div>
          <div><span class="hl">短码：</span>空的数量 + 位置，组成索引</div>
          <div><span class="hl">还原：</span>短码 + 规则 → 反向展开 → 原文</div>
          <div><span class="hl">示例版：</span>压缩方法是占位，规则可替换</div>
        </div>
      </div>

      <div class="end">
        <p>
          <span class="gold">规则私有</span><br>
          <span class="green">内容公开</span><br>
          <span class="blue">还原在服务器端</span>
        </p>
        <div class="foot">技术设想 · 示例版 · 先跑通再调规则</div>
      </div>

    </div>
    `
  </script>
  <script src="./js/meta-loader.js"></script>
</head>
<body>
</body>
</html>
