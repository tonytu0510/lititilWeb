<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shanna.Li">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>衰减验证 · 演示</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./common.css">
    <script src="./dino-game.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            font-family: 'Courier New', monospace;
        }
        .wrap{
            display: flex;
            justify-content: center;
            align-items: center;
            width:100%;
            height: calc(100vh - 50px);
        }
        .container {
            background: #181818;
            border-radius: 16px;
            padding: 30px 32px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 28px rgba(0,0,0,0.9);
            max-width: 600px;
            min-height: 300px;
        }
        .title {
            color: #7cb8b8;
            font-size: 14px;
            letter-spacing: 4px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .sub {
            color: #555;
            font-size: 11px;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .row input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 10px 14px;
            color: #d0d0d0;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            outline: none;
        }
        .row input:focus {
            border-color: #555;
        }
        .row button {
            background: #2a2a2a;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            color: #d0d0d0;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: 0.2s;
        }
        .row button:hover {
            background: #3d3d3d;
        }

        .box {
            background: #0f0f0f;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 3px solid #2a2a2a;
        }
        .box .label {
            color: #666;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .box .value {
            color: #d0d0d0;
            font-size: 14px;
            word-break: break-all;
            line-height: 1.6;
        }
        .box .value.highlight {
            color: #7cb8b8;
        }

        .badge-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            padding: 0 2px;
        }
        .badge {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 30px;
            background: #181818;
            color: #555;
        }
        .badge.ok {
            background: #142a22;
            color: #7cb8b8;
        }
        .badge.fail {
            background: #2a1414;
            color: #c87a7a;
        }

        .proto {
            background: #0a0a0a;
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 6px;
            color: #555;
            font-size: 12px;
            line-height: 1.8;
            border: 1px dashed #222;
        }
        .proto strong {
            color: #888;
        }
        .proto .highlight {
            color: #7cb8b8;
        }

        .foot {
            color: #444;
            font-size: 11px;
            text-align: center;
            margin-top: 14px;
            border-top: 1px solid #1a1a1a;
            padding-top: 12px;
            letter-spacing: 0.5px;
        }
        .foot span {
            color: #7cb8b8;
        }
    </style>
</head>
<body>
<div id="topBarContainer"></div>
<div class="wrap">
    <div class="container">
        <div class="title">⬡ 衰减验证 · 演示</div>
        <div class="sub">上次电流 ↔ 本次电流 · 对比即验证</div>

        <div class="row">
            <input type="number" id="lastCurrent" value="100" placeholder="上次电流值" step="0.1">
            <input type="number" id="currentCurrent" value="98" placeholder="本次电流值" step="0.1">
            <button id="runBtn">验证</button>
        </div>

        <div class="box">
            <div class="label">📌 上次电流</div>
            <div class="value highlight" id="lastDisplay">100</div>
        </div>
        <div class="box">
            <div class="label">📌 本次电流</div>
            <div class="value highlight" id="currentDisplay">98</div>
        </div>
        <div class="box">
            <div class="label">✅ 验证结果</div>
            <div class="value" id="resultDisplay">——</div>
        </div>
        <div class="badge-row">
            <span class="badge" id="statusBadge">⏳ 就绪</span>
            <span class="badge" id="matchBadge">——</span>
        </div>
        <div class="proto" id="protocolDisplay">
            <strong>验证规则：</strong> 电流不应增大 · 衰减应在合理范围内
        </div>
        <div class="foot">
            <span>上次与本次对比</span> · 无需时钟 · 无需网络
        </div>
    </div>
</div>
<script src="./common.js"></script>
<script>
    (function() {
        const lastInput = document.getElementById('lastCurrent');
        const currentInput = document.getElementById('currentCurrent');
        const runBtn = document.getElementById('runBtn');
        const lastDisplay = document.getElementById('lastDisplay');
        const currentDisplay = document.getElementById('currentDisplay');
        const resultDisplay = document.getElementById('resultDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const matchBadge = document.getElementById('matchBadge');
        const protocolDisplay = document.getElementById('protocolDisplay');

        function validate(last, current) {
            // 规则1：电流不应增大（物理衰减）
            if (current > last) {
                return {
                    ok: false,
                    reason: '电流异常增大（磁铁不会反向增强）'
                };
            }
            // 规则2：衰减应在合理范围内（允许浮动，但不应骤降）
            const drop = last - current;
            const dropRatio = drop / last;
            // 自然衰减通常较缓慢，设定每次使用衰减不超过10%为合理
            if (dropRatio > 0.10) {
                return {
                    ok: false,
                    reason: `衰减过快 (${(dropRatio * 100).toFixed(1)}%)，超出合理范围`
                };
            }
            return {
                ok: true,
                reason: `衰减 ${(dropRatio * 100).toFixed(1)}%，在合理范围内`
            };
        }

        function run() {
            const last = parseFloat(lastInput.value);
            const current = parseFloat(currentInput.value);

            if (isNaN(last) || isNaN(current)) {
                resultDisplay.textContent = '⚠️ 请输入有效数字';
                statusBadge.textContent = '⚠️ 输入无效';
                statusBadge.className = 'badge fail';
                matchBadge.textContent = '——';
                matchBadge.className = 'badge';
                return;
            }

            lastDisplay.textContent = last;
            currentDisplay.textContent = current;

            const result = validate(last, current);

            if (result.ok) {
                resultDisplay.textContent = `✅ 通过 (${result.reason})`;
                statusBadge.textContent = '✅ 验证通过';
                statusBadge.className = 'badge ok';
                matchBadge.textContent = '✅ 双因子匹配';
                matchBadge.className = 'badge ok';
            } else {
                resultDisplay.textContent = `❌ 不通过 (${result.reason})`;
                statusBadge.textContent = '❌ 验证失败';
                statusBadge.className = 'badge fail';
                matchBadge.textContent = '❌ 不匹配';
                matchBadge.className = 'badge fail';
            }

            protocolDisplay.innerHTML = `
                <strong>验证规则：</strong> 电流不应增大 · 衰减应在合理范围内<br>
                上次电流: <span class="highlight">${last}</span> → 本次电流: <span class="highlight">${current}</span> · 差值: ${(last - current).toFixed(2)}
            `;
        }

        runBtn.addEventListener('click', run);
        lastInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
        currentInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
        run();
    })();
</script>
</body>
</html>
