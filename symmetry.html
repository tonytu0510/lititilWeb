<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shanna.Li">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>对称 · 笔记</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./common.css">
    <script src="./dino-game.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            font-family: 'Courier New', monospace;
        }
        .wrap{
            display: flex;
            justify-content: center;
            align-items: center;
            width:100%;
            min-height: 90vh;
            padding:20px 0
        }
        .container {
            background: #181818;
            border-radius: 16px;
            padding: 30px 32px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 28px rgba(0,0,0,0.9);
            max-width: 600px;
            min-height: 300px;
            width: 100%;
        }
        .title {
            color: #d0d0d0;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 14px;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .title span {
            color: #7cb8b8;
        }
        .entry {
            color: #999;
            font-size: 14px;
            line-height: 1.8;
            padding: 12px 16px;
            border-left: 3px solid #2a2a2a;
            background: #0f0f0f;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .entry .highlight {
            color: #7cb8b8;
        }
        .entry .dim {
            color: #555;
        }
        .entry .warning {
            color: #c87a7a;
        }
        .entry .gold {
            color: #e8a838;
        }
        .foot {
            color: #444;
            font-size: 11px;
            text-align: center;
            margin-top: 16px;
            letter-spacing: 1px;
        }
        .foot span {
            color: #7cb8b8;
        }
        .tag {
            display: inline-block;
            color: #555;
            font-size: 11px;
            border: 1px solid #2a2a2a;
            padding: 2px 10px;
            border-radius: 20px;
            margin-right: 4px;
        }
        .meta {
            color: #444;
            font-size: 12px;
            margin-top: 12px;
            text-align: right;
            letter-spacing: 0.5px;
        }
        .divider {
            border-top: 1px dashed #2a2a2a;
            margin: 18px 0;
        }
        .sym-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 4px 0;
        }
        .sym-row .good {
            color: #7cb8b8;
        }
        .sym-row .bad {
            color: #c87a7a;
        }
    </style>
</head>
<body>
<div id="topBarContainer"></div>
<div class="wrap">
<div class="container">
    <div class="title">⬡ <span>对称</span> · 笔记</div>

    <div class="entry">
        <span class="dim"># 笔记 2026-09-03</span><br><br>
        真 善 美 —— 左右对称，字形规整，中心可寻。<br>
        假 恶 丑 —— 左右失衡，重心偏移，结构不稳。<br><br>
        <span class="highlight">对称不是美学的唯一标准，但它是一个可测量的分界线。</span>
    </div>

    <div class="entry">
        <div class="sym-row">
            <span class="good">真</span>
            <span class="good">善</span>
            <span class="good">美</span>
            <span style="color:#444;">丨</span>
            <span class="bad">假</span>
            <span class="bad">恶</span>
            <span class="bad">丑</span>
        </div>
        <div style="color:#555; font-size:12px; text-align:center; margin-top:4px;">
            对称 · 不对称
        </div>
    </div>

    <div class="entry">
        <span class="dim"># 扩展</span><br><br>
        英文大写对称字母：A H I M O T U V W X Y<br>
        中文对称字：王 中 口 日 田 申 丰 来 木 林<br>
        <span class="dim">——对称结构本身不带立场，但人习惯把对称与“正”关联。</span>
    </div>

    <div class="divider"></div>

    <div style="color:#555; font-size:12px; line-height:1.8; padding: 4px 0;">
        <span class="tag">对称</span>
        <span class="tag">结构</span>
        <span class="tag">正</span>
        <span class="tag">偏</span>
    </div>

    <div class="meta">
        仅作记录 · 不构成任何结论
    </div>

    <div class="foot">
        <span>对称笔记</span> · 不定期更新
    </div>
</div>
</div>
<script src="./common.js"></script>
</body>
</html>
