<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shanna.Li">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九大太阳系 · 对合环</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./common.css">
    <script src="./dino-game.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .tip {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(212, 167, 116, 0.55);
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="topBarContainer"></div>
    <div class="tip">九大太阳系 · 对合环 | 鼠标拖动旋转视角</div>
    <script src="./common.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 40, 90);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
        controls.maxDistance = 180;
        controls.minDistance = 30;

        // 中心发光体
        const centerGeo = new THREE.SphereGeometry(5, 64, 64);
        const centerMat = new THREE.MeshBasicMaterial({ color: 0xf0d060 });
        const centerCore = new THREE.Mesh(centerGeo, centerMat);
        scene.add(centerCore);

        const glowGeo = new THREE.SphereGeometry(8, 64, 64);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xd4a017,
            transparent: true,
            opacity: 0.16
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        scene.add(glow);

        // 九个太阳系
        const colors = [
            0xc41e3a, 0xd4a017, 0xf0d060, 0x8b0000,
            0x4a7c59, 0x88aacc, 0xcc8899, 0x00aaaa, 0xddaa88
        ];

        const systems = colors.map((color, i) => {
            const group = new THREE.Group();

            // 星球本体
            const radius = 2 + Math.random() * 2;
            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.35,
                metalness: 0.1,
                emissive: new THREE.Color(color),
                emissiveIntensity: 0.25
            });
            const sphere = new THREE.Mesh(geo, mat);
            group.add(sphere);

            // 星环
            const ringGeo = new THREE.TorusGeometry(radius + 2.5, 0.35, 16, 64);
            const ringMat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.5,
                metalness: 0.4,
                emissive: new THREE.Color(color),
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.55
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2.2;
            ring.rotation.y = Math.PI / 4;
            group.add(ring);

            const radius2 = radius + 5;
            const ring2Geo = new THREE.TorusGeometry(radius2, 0.18, 16, 64);
            const ring2Mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.6,
                metalness: 0.3,
                transparent: true,
                opacity: 0.25
            });
            const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
            ring2.rotation.x = Math.PI / 1.8;
            ring2.rotation.z = Math.PI / 5;
            group.add(ring2);

            scene.add(group);

            return {
                group,
                sphere,
                ring,
                ring2,
                color,
                angle: Math.PI * 2 * i / 9,
                orbitRadius: 28 + Math.random() * 14,
                heightOffset: -12 + Math.random() * 24,
                speed: 0.002 + Math.random() * 0.003,
                selfRotate: 0.004 + Math.random() * 0.008,
                radius
            };
        });

        // 背景星星
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2500;
        const positions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 400;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0xd4a017,
            size: 0.35,
            transparent: true,
            opacity: 0.5
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // 轨道线
        systems.forEach(sys => {
            const orbitCurve = new THREE.EllipseCurve(
                0, 0,
                sys.orbitRadius, sys.orbitRadius * 0.55,
                0, 2 * Math.PI,
                false, 0
            );
            const orbitPoints = orbitCurve.getPoints(120);
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(
                orbitPoints.map(p => new THREE.Vector3(p.x, sys.heightOffset, p.y))
            );
            const orbitMat = new THREE.LineBasicMaterial({
                color: sys.color,
                transparent: true,
                opacity: 0.12
            });
            const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
            scene.add(orbitLine);
        });

        // 光照
        const ambientLight = new THREE.AmbientLight(0x604030, 1.2);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xf0d060, 2, 120);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0xc41e3a, 1.2, 180);
        pointLight2.position.set(0, 30, 0);
        scene.add(pointLight2);

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            systems.forEach(sys => {
                sys.angle += sys.speed;

                const x = Math.cos(sys.angle) * sys.orbitRadius;
                const z = Math.sin(sys.angle) * sys.orbitRadius * 0.55;
                const y = sys.heightOffset + Math.sin(sys.angle * 1.6) * 6;

                sys.group.position.set(x, y, z);

                sys.sphere.rotation.y += sys.selfRotate;
                sys.ring.rotation.z += sys.selfRotate * 0.8;
                sys.ring2.rotation.y += sys.selfRotate * 0.6;
            });

            glow.rotation.x += 0.001;
            glow.rotation.y += 0.002;
            stars.rotation.y += 0.0003;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
