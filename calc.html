<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shanna.Li">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>年份规则计算器</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./common.css">
    <script src="./dino-game.js"></script>
<style>
  :root{
    --bg:#0b0f14;
    --card:#121922;
    --card2:#0f1620;
    --line:#223041;
    --text:#e8eef6;
    --muted:#8fa3b8;
    --gold:#f0b429;
    --green:#3ddc97;
    --blue:#4da3ff;
    --red:#ff7b7b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(77,163,255,.18), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(240,180,41,.12), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.8;
  }
  .wrap{max-width:900px;margin:0 auto;padding:48px 14px}

  .tag{
    display:inline-block;
    font-size:13px;
    letter-spacing:2px;
    color:var(--gold);
    border:1px solid rgba(240,180,41,.35);
    border-radius:999px;
    padding:5px 14px;
    margin-bottom:22px;
  }

  h1{
    font-size:clamp(26px,4.5vw,42px);
    line-height:1.3;
    font-weight:800;
    letter-spacing:-.5px;
    margin-bottom:18px;
  }
  h1 .hl{
    background:linear-gradient(90deg,var(--gold),#ffd76a);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--muted);
    font-size:clamp(15px,2vw,17px);
    max-width:720px;
    margin-bottom:42px;
  }

  .section-title{
    font-size:14px;
    letter-spacing:3px;
    color:var(--muted);
    margin:52px 0 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg,var(--line),transparent);
  }

  .panel{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    margin-bottom:16px;
  }
  .panel label{
    display:block;
    font-size:14px;
    color:var(--gold);
    letter-spacing:1px;
    margin-bottom:10px;
  }
  input{
    width:100%;
    background:#0a0e13;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-size:16px;
    font-family:inherit;
    outline:none;
    margin-bottom:14px;
  }
  input:focus{
    border-color:var(--gold);
  }

  .btns{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:18px 0;
  }
  button{
    background:linear-gradient(180deg,#1a2330,#121922);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 22px;
    font-size:15px;
    cursor:pointer;
    transition:.25s;
    font-family:inherit;
  }
  button:hover{
    border-color:var(--gold);
    color:#fff;
    transform:translateY(-2px);
  }
  button.gold{
    border-color:rgba(240,180,41,.5);
    color:var(--gold);
  }

  .result{
    background:#0a0e13;
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    font-size:15px;
    color:#c6d4e3;
    line-height:2.2;
    white-space:pre-wrap;
  }
  .result .hl{color:var(--gold);font-weight:700}
  .result .green{color:var(--green)}
  .result .blue{color:var(--blue)}

  .end{
    margin-top:60px;
    text-align:center;
    padding:40px 20px;
    border-top:1px solid var(--line);
  }
  .end p{
    font-size:clamp(16px,2.4vw,20px);
    font-weight:800;
    line-height:1.9;
  }
  .end .gold{color:var(--gold)}
  .end .green{color:var(--green)}
  .end .blue{color:var(--blue)}
  .foot{
    margin-top:26px;
    color:#5f7288;
    font-size:13px;
  }
</style>
</head>
<body>
    <div id="topBarContainer"></div>
<div class="wrap">

  <div class="tag">我的想法 · 工具</div>

  <h1>
    年份规则计算器<br>
    <span class="hl">相同约分 + 奇偶转 0/1</span>
  </h1>

  <p class="sub">
    B：数字相同的全部约分，只保留出现 1 次的数字，0 也丢掉。<br>
    A：大于 1 的数，奇数转 0，偶数转 1；小于等于 1 的数保留。
  </p>

  <div class="section-title">一、输入</div>
  <div class="panel">
    <label>当前年份</label>
    <input type="number" id="currentYear" value="2026" placeholder="如 2026">

    <label>客户生日年份</label>
    <input type="number" id="birthYear" value="2000" placeholder="如 2000">
  </div>

  <div class="btns">
    <button class="gold" onclick="runCalc()">计算</button>
    <button onclick="clearAll()">清空</button>
  </div>

  <div class="section-title">二、结果</div>
  <div class="panel">
    <div class="result" id="resultBox">点“计算”后，结果显示在这里。</div>
  </div>

  <div class="section-title">三、规则说明</div>
  <div class="panel">
    <div style="color:#c6d4e3;font-size:15px;line-height:2">
      <div><span style="color:var(--gold)">B：</span>数字相同的全部约分，只保留出现 1 次的数字，0 也丢掉</div>
      <div><span style="color:var(--gold)">A：</span>大于 1 的数，奇数转 0，偶数转 1；小于等于 1 的数保留</div>
      <div><span style="color:var(--gold)">最终：</span>两边各出一串结果，对比是否相等</div>
    </div>
  </div>

  <div class="end">
    <p>
      <span class="gold">相同约分</span><br>
      <span class="green">奇偶转 0/1</span><br>
      <span class="blue">对比结果</span>
    </p>
    <div class="foot">个人观点 · 欢迎讨论</div>
  </div>

</div>

<script>
  // ===== B：数字相同的全部约分 =====
  function ruleB(numStr){
    const arr = numStr.split('');
    const count = new Map();
    for (const item of arr) {
      count.set(item, (count.get(item) || 0) + 1);
    }
    const result = [];
    for (const [item, times] of count) {
      if (times === 1 && item !== '0') {
        result.push(item);
      }
    }
    return result.join('');
  }

  // ===== A：奇偶规则 =====
  // 大于 1 的数：奇数转 0，偶数转 1
  // 小于等于 1 的数：保留
  function ruleA(numStr){
    let out = '';
    for(let i=0;i<numStr.length;i++){
      const n = parseInt(numStr[i]);
      if(n > 1){
        out += (n % 2 === 1) ? '0' : '1';
      }else{
        out += numStr[i];
      }
    }
    return out;
  }

  function runCalc(){
    const curStr = document.getElementById('currentYear').value.trim();
    const birthStr = document.getElementById('birthYear').value.trim();

    if(!curStr || !birthStr){
      document.getElementById('resultBox').textContent = '请输入两个年份。';
      return;
    }

    const curB = ruleB(curStr);
    const curA = ruleB(ruleA(curB));

    const birthB = ruleB(birthStr);
    const birthA = ruleB(ruleA(birthB));

    let out = '';
    out += '【当前年份】' + curStr + '\n';
    out += '  B：' + (curB || '（空）') + '\n';
    out += '  A：' + (curA || '（空）') + '\n\n';

    out += '【客户生日年份】' + birthStr + '\n';
    out += '  B：' + (birthB || '（空）') + '\n';
    out += '  A：' + (birthA || '（空）') + '\n\n';

    out += '【对比】' + curA + ' == ' + birthA + '\n';
    out += '【是否相等】' + (curA === birthA ? '是' : '否') + '\n';

    document.getElementById('resultBox').textContent = out;
  }

  function clearAll(){
    document.getElementById('currentYear').value = '';
    document.getElementById('birthYear').value = '';
    document.getElementById('resultBox').textContent = '点“计算”后，结果显示在这里。';
  }
</script>

<script src="./common.js"></script>
</body>
</html>
