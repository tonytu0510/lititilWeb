<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tony.tu">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>缘分测试 - 纯属娱乐</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="common.css">
    <script src="dino-game.js"></script>
    <style>
        :root {
            --bg: #0a0000;
            --card: #1a0000;
            --text: #d4c8b8;
            --gold: #d4a017;
            --gold-light: #f0d060;
            --red: #c41e3a;
            --red-dark: #8b0000;
            --red-light: #e8384f;
            --green: #4a7c59;
            --border: #3a1010;
            --star: #f0d060;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Serif SC", "SimSun", "STSong", serif;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(212, 160, 23, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(196, 30, 58, 0.08) 0%, transparent 60%);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212, 160, 23, 0.3);
        }

        .header h1 {
            font-size: 24px;
            color: var(--gold);
            letter-spacing: 4px;
            font-weight: normal;
        }

        .header .subtitle {
            font-size: 12px;
            color: #886644;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .header .version {
            font-size: 10px;
            color: #664422;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.05);
        }

        /* 语言切换标签 */
        .lang-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .lang-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 2px;
            background: #0d0000;
            color: #886644;
            transition: all 0.3s;
            border: none;
            font-family: inherit;
        }

        .lang-tab.active {
            background: var(--red-dark);
            color: var(--gold-light);
            border-color: var(--gold);
        }

        .lang-tab:hover {
            color: var(--gold);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .input-group .plus {
            color: var(--gold);
            font-size: 20px;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper label {
            display: block;
            font-size: 11px;
            color: #996644;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px;
            background: #0d0000;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(212, 160, 23, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #442222;
        }

        /* 单选自测模式 */
        .single-mode {
            display: none;
            margin-bottom: 24px;
        }

        .single-mode.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--red-dark), var(--red));
            border: 1px solid var(--gold);
            color: var(--gold-light);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 10px rgba(240, 208, 96, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--red), var(--red-light));
            border-color: var(--gold-light);
            box-shadow: 0 0 20px rgba(212, 160, 23, 0.2);
        }

        .btn:active {
            background: var(--red-dark);
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.3);
        }

        .btn.loading {
            pointer-events: none;
            color: transparent;
            text-shadow: none;
        }

        .btn.loading::after {
            content: '★';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--gold-light);
            animation: spinStar 0.8s linear infinite;
        }

        @keyframes spinStar {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.05);
        }

        .result-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .result-title.zero {
            color: var(--gold);
            text-shadow: 0 0 15px rgba(212, 160, 23, 0.3);
        }

        .result-title.not-zero {
            color: var(--red-light);
        }

        .result-detail {
            font-size: 13px;
            color: #998877;
            line-height: 1.8;
            margin-top: 16px;
        }

        .result-detail span {
            color: var(--gold);
        }

        .steps {
            margin-top: 20px;
            text-align: left;
            font-size: 12px;
            color: #776655;
            line-height: 2;
        }

        .steps .step-num {
            color: var(--gold);
            margin-right: 4px;
        }

        .divider {
            text-align: center;
            color: #553333;
            font-size: 11px;
            letter-spacing: 3px;
            margin: 20px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '★';
            margin: 0 10px;
            font-size: 8px;
            color: var(--gold);
            opacity: 0.5;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: #553333;
            letter-spacing: 2px;
            margin-top: 40px;
        }

        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            color: var(--gold);
            opacity: 0;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            .card {
                padding: 24px 16px;
            }
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="stars-bg" id="starsBg"></div>
    <div id="topBarContainer"></div>
    <div class="container">
        <div class="header">
            <div class="icon">★</div>
            <h1>对合环 · 姓名配对</h1>
            <div class="subtitle">基于对合环V2.0 + NG规则 + 69归零</div>
            <div class="version">V2.0 · 支持中英文 · 支持自测</div>
        </div>

        <div class="card">
            <!-- 模式切换 -->
            <div class="lang-tabs">
                <button class="lang-tab active" onclick="switchMode('pair')">★ 双人配对 ★</button>
                <button class="lang-tab" onclick="switchMode('single')">★ 单人自测 ★</button>
            </div>

            <!-- 双人配对 -->
            <div class="input-group" id="pairInputs">
                <div class="input-wrapper">
                    <label>姓名 A</label>
                    <input type="text" id="nameA" placeholder="中文或英文" maxlength="20">
                </div>
                <div class="plus">★</div>
                <div class="input-wrapper">
                    <label>姓名 B</label>
                    <input type="text" id="nameB" placeholder="中文或英文" maxlength="20">
                </div>
            </div>

            <!-- 单人自测 -->
            <div class="single-mode" id="singleInput">
                <div class="input-wrapper">
                    <label>输入姓名</label>
                    <input type="text" id="nameSingle" placeholder="中文或英文" maxlength="20">
                </div>
            </div>

            <button class="btn" id="checkBtn" onclick="checkPair()">开 始 验 算</button>
        </div>

        <div class="result" id="result">
            <div class="result-card">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-title" id="resultTitle"></div>
                <div class="result-detail" id="resultDetail"></div>
                <div class="steps" id="steps"></div>
            </div>
        </div>

        <div class="footer">
            ★ 纯属娱乐 · 切勿当真 · 对合环加密系统 V9.0 ★
        </div>
    </div>
    <script src="common.js"></script>
    <script src="commonOtherPage.js"></script>
    <script>
        // 背景星星
        (function() {
            const bg = document.getElementById('starsBg');
            const stars = '★☆✯✪✶✷✹✺';
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = stars[Math.floor(Math.random() * stars.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = (8 + Math.random() * 16) + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 4) + 's';
                bg.appendChild(star);
            }
        })();

        // 当前模式：'pair' 或 'single'
        let currentMode = 'pair';

        function switchMode(mode) {
            currentMode = mode;
            const tabs = document.querySelectorAll('.lang-tab');
            tabs.forEach(t => t.classList.remove('active'));

            if (mode === 'pair') {
                tabs[0].classList.add('active');
                document.getElementById('pairInputs').style.display = 'flex';
                document.getElementById('singleInput').classList.remove('show');
                document.getElementById('checkBtn').textContent = '开 始 验 算';
            } else {
                tabs[1].classList.add('active');
                document.getElementById('pairInputs').style.display = 'none';
                document.getElementById('singleInput').classList.add('show');
                document.getElementById('checkBtn').textContent = '开 始 自 测';
            }
        }

        // 判断是否为中文
        function hasChinese(str) {
            return /[\u4e00-\u9fa5]/.test(str);
        }

        // 对合数字映射表
        const HEHE_MAP = {
            'a': [3], 'b': [8], 'c': [6], 'd': [3, 8], 'e': [3],
            'f': [6], 'g': [3, 9], 'h': [4], 'i': [3], 'j': [2],
            'k': [4], 'l': [7], 'm': [2, 9], 'n': [3, 8], 'o': [3],
            'p': [9], 'q': [8], 'r': [2, 3], 's': [2], 't': [6],
            'u': [5], 'v': [5], 'w': [5], 'x': [10], 'y': [3], 'z': [2, 5],
            'A': [5], 'B': [8], 'C': [6], 'D': [0], 'E': [3],
            'F': [6], 'G': [9], 'H': [4], 'I': [1], 'J': [2, 9],
            'K': [4], 'L': [7], 'M': [2], 'N': [5, 8], 'O': ['/0'],
            'P': [9], 'Q': [8], 'R': [2, 7], 'S': [2], 'T': [6],
            'U': [5], 'V': [5], 'W': [5], 'X': [10], 'Y': [1, 5, 6], 'Z': [2, 5]
        };

        const NG_LIST = ['ang', 'iang', 'uang', 'eng', 'ing', 'ueng', 'ong', 'iong'];
        const VOWELS_EN = ['a', 'e', 'i', 'o', 'u', 'A', 'E', 'I', 'O', 'U'];

        // 中文拼音映射
        function getPinyin(char) {
            const map = {
                '赵': 'zhao', '钱': 'qian', '孙': 'sun', '李': 'li', '周': 'zhou', '吴': 'wu',
                '郑': 'zheng', '王': 'wang', '冯': 'feng', '陈': 'chen', '卫': 'wei', '蒋': 'jiang',
                '沈': 'shen', '韩': 'han', '杨': 'yang', '朱': 'zhu', '秦': 'qin', '许': 'xu',
                '何': 'he', '吕': 'lv', '张': 'zhang', '孔': 'kong', '曹': 'cao', '严': 'yan',
                '华': 'hua', '金': 'jin', '魏': 'wei', '陶': 'tao', '姜': 'jiang', '谢': 'xie',
                '邹': 'zou', '喻': 'yu', '苏': 'su', '潘': 'pan', '葛': 'ge', '范': 'fan',
                '彭': 'peng', '鲁': 'lu', '马': 'ma', '方': 'fang', '俞': 'yu', '任': 'ren',
                '袁': 'yuan', '柳': 'liu', '史': 'shi', '唐': 'tang', '薛': 'xue', '雷': 'lei',
                '贺': 'he', '罗': 'luo', '郝': 'hao', '常': 'chang', '于': 'yu', '齐': 'qi',
                '康': 'kang', '顾': 'gu', '黄': 'huang', '萧': 'xiao', '姚': 'yao', '汪': 'wang',
                '毛': 'mao', '狄': 'di', '米': 'mi', '戴': 'dai', '宋': 'song', '庞': 'pang',
                '熊': 'xiong', '纪': 'ji', '董': 'dong', '梁': 'liang', '杜': 'du', '贾': 'jia',
                '江': 'jiang', '郭': 'guo', '林': 'lin', '钟': 'zhong', '徐': 'xu', '高': 'gao',
                '蔡': 'cai', '田': 'tian', '胡': 'hu', '凌': 'ling', '万': 'wan', '卢': 'lu',
                '邓': 'deng', '洪': 'hong', '石': 'shi', '龚': 'gong', '程': 'cheng', '陆': 'lu',
                '荣': 'rong', '段': 'duan', '焦': 'jiao', '谷': 'gu', '侯': 'hou', '刘': 'liu',
                '龙': 'long', '叶': 'ye', '白': 'bai', '卓': 'zhuo', '屠': 'tu', '蒙': 'meng',
                '习': 'xi', '居': 'ju', '耿': 'geng', '国': 'guo', '东': 'dong', '聂': 'nie',
                '关': 'guan', '红': 'hong', '刚': 'gang', '光': 'guang', '明': 'ming', '敏': 'min',
                '杰': 'jie', '军': 'jun', '鹏': 'peng', '飞': 'fei', '婷': 'ting', '涛': 'tao',
                '悦': 'yue', '果': 'guo', '泽': 'ze', '近': 'jin', '平': 'ping', '丽': 'li',
                '媛': 'yuan', '恩': 'en', '来': 'lai', '超': 'chao', '德': 'de', '克': 'ke',
                '清': 'qing', '少': 'shao', '奇': 'qi', '美': 'mei', '小': 'xiao', '若': 'ruo',
                '木': 'mu', '瑞': 'rui', '月': 'yue', '琴': 'qin', '开': 'kai', '慧': 'hui',
                '子': 'zi', '珍': 'zhen', '青': 'qing', '静': 'jing', '磊': 'lei', '琳': 'lin',
                '鑫': 'xin', '淼': 'miao', '森': 'sen', '焱': 'yan', '垚': 'yao', '晶': 'jing',
                '品': 'pin', '众': 'zhong', '皇': 'huang', '后': 'hou', '棣': 'di', '妙': 'miao',
                '云': 'yun', '彻': 'che', '夫': 'fu', '妙': 'miao', '若': 'ruo', '文': 'wen',
                '广': 'guang', '学': 'xue', '良': 'liang', '宇': 'yu', '浩': 'hao', '然': 'ran',
                '天': 'tian', '一': 'yi', '鸣': 'ming'
            };
            return map[char] || '';
        }

        // 中文名提取辅音
        function extractConsonantsCN(name) {
            let consonants = '';
            for (let char of name) {
                let pinyin = getPinyin(char);
                if (pinyin) {
                    let clean = pinyin.replace(/[1-4]/g, '');
                    for (let ng of NG_LIST) {
                        if (clean.endsWith(ng)) {
                            clean = clean.slice(0, -ng.length);
                            break;
                        }
                    }
                    if (clean) consonants += clean[0];
                }
            }
            return consonants;
        }

        // 英文名提取辅音
        function extractConsonantsEN(name) {
            let consonants = '';
            for (let ch of name) {
                if (!VOWELS_EN.includes(ch) && ch !== ' ') {
                    consonants += ch;
                }
            }
            return consonants;
        }

        // 智能提取：自动判断中英文
        function extractConsonants(name) {
            if (!name) return '';
            if (hasChinese(name)) {
                return extractConsonantsCN(name);
            } else {
                return extractConsonantsEN(name);
            }
        }

        // 走对合环
        function toHeheNumbers(consonants) {
            let upper = consonants.toUpperCase();
            let numbers = [];
            let details = [];
            for (let ch of upper) {
                if (HEHE_MAP[ch]) {
                    let nums = HEHE_MAP[ch];
                    let chosen = nums[0];
                    if (nums.includes(9)) chosen = 9;
                    if (nums.includes(6) && !nums.includes(9)) chosen = 6;
                    numbers.push(chosen);
                    details.push(`${ch}→${chosen}`);
                } else {
                    details.push(`${ch}→?`);
                }
            }
            return { numbers, details };
        }

        function check69(numbers) {
            return numbers.includes(6) && numbers.includes(9);
        }

        function checkPair() {
            let nameA, nameB, isSingle = false;

            if (currentMode === 'single') {
                nameA = document.getElementById('nameSingle').value.trim();
                nameB = '';
                isSingle = true;
            } else {
                nameA = document.getElementById('nameA').value.trim();
                nameB = document.getElementById('nameB').value.trim();
            }

            const btn = document.getElementById('checkBtn');

            if (!nameA) {
                alert('请输入姓名');
                return;
            }
            if (!isSingle && !nameB) {
                alert('请输入两个姓名');
                return;
            }

            btn.classList.add('loading');
            btn.textContent = '';

            setTimeout(() => {
                const consA = extractConsonants(nameA);
                const consB = isSingle ? '' : extractConsonants(nameB);
                const combined = consA + consB;
                const { numbers, details } = toHeheNumbers(combined);
                const isZero = check69(numbers);

                showResult(nameA, nameB, consA, consB, combined, details, numbers, isZero, isSingle);

                btn.classList.remove('loading');
                btn.textContent = currentMode === 'single' ? '再 测 一 次' : '再 测 一 次';
            }, 1000);
        }

        function showResult(nameA, nameB, consA, consB, combined, details, numbers, isZero, isSingle) {
            const resultDiv = document.getElementById('result');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const detail = document.getElementById('resultDetail');
            const steps = document.getElementById('steps');

            resultDiv.classList.add('show');

            if (isZero) {
                icon.textContent = '★';
                icon.style.color = '#f0d060';
                icon.style.textShadow = '0 0 30px rgba(240, 208, 96, 0.5)';
                title.textContent = isSingle ? '自对合归零 · 自身圆满' : '对合归零 · 完全对冲';
                title.className = 'result-title zero';
                if (isSingle) {
                    detail.innerHTML = `
                        <p>${nameA}</p>
                        <p>自身对合数字序列同时包含<span>6和9</span></p>
                        <p>69归零 · 自归零 · 无需配对</p>
                    `;
                } else {
                    detail.innerHTML = `
                        <p>${nameA} 与 ${nameB}</p>
                        <p>在对合环意义上<span>完全对冲</span></p>
                        <p>69归零 · 中心0</p>
                    `;
                }
            } else {
                const has6 = numbers.includes(6);
                const has9 = numbers.includes(9);
                let reason = '';
                if (has6 && !has9) reason = '有合(6)无久(9)';
                else if (!has6 && has9) reason = '有久(9)无合(6)';
                else reason = '无合(6)无久(9)';

                icon.textContent = '✶';
                icon.style.color = '#e8384f';
                icon.style.textShadow = '0 0 20px rgba(232, 56, 79, 0.4)';
                title.textContent = '未归零 · ' + reason;
                title.className = 'result-title not-zero';

                if (isSingle) {
                    detail.innerHTML = `
                        <p>${nameA}</p>
                        <p>对合数字序列：<span>[${numbers.join(', ')}]</span></p>
                        <p>${reason} · 需配对补全</p>
                    `;
                } else {
                    detail.innerHTML = `
                        <p>${nameA} 与 ${nameB}</p>
                        <p>对合数字序列：<span>[${numbers.join(', ')}]</span></p>
                        <p>${reason}</p>
                    `;
                }
            }

            const typeLabel = hasChinese(nameA + nameB) ? '中文' : '英文';
            const consALabel = consA || '(空)';
            const consBLabel = isSingle ? '' : `，${nameB} → ${consB || '(空)'}`;
            const combinedLabel = combined || '(空)';

            steps.innerHTML = `
                <div class="divider">验算过程（${typeLabel}模式）</div>
                <p><span class="step-num">★</span> 辅音骨架：${nameA} → ${consALabel}${consBLabel}</p>
                <p><span class="step-num">★</span> 拼接：${isSingle ? consA : consA + ' + ' + consB} = ${combinedLabel}</p>
                <p><span class="step-num">★</span> 对合环第一圈（大写）：${combined.toUpperCase() || '(空)'}</p>
                <p><span class="step-num">★</span> 对合数字：${details.join(', ') || '(无)'}</p>
                <p><span class="step-num">★</span> 69规则：${isZero ? '6和9同时出现 → 归中心0 ★' : '未同时出现6和9 → 未归零'}</p>
            `;

            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPair();
            }
        });
    </script>
</body>
</html>
