<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对合环姓名配对 - 纯属娱乐</title>
    <style>
        :root {
            --bg: #0a0000;
            --card: #1a0000;
            --text: #d4c8b8;
            --gold: #d4a017;
            --gold-light: #f0d060;
            --red: #c41e3a;
            --red-dark: #8b0000;
            --red-light: #e8384f;
            --green: #4a7c59;
            --border: #3a1010;
            --star: #f0d060;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Serif SC", "SimSun", "STSong", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(212, 160, 23, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(196, 30, 58, 0.08) 0%, transparent 60%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212, 160, 23, 0.3);
        }

        .header h1 {
            font-size: 24px;
            color: var(--gold);
            letter-spacing: 4px;
            font-weight: normal;
        }

        .header .subtitle {
            font-size: 12px;
            color: #886644;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.05);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .input-group .plus {
            color: var(--gold);
            font-size: 20px;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper label {
            display: block;
            font-size: 11px;
            color: #996644;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px;
            background: #0d0000;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(212, 160, 23, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #442222;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--red-dark), var(--red));
            border: 1px solid var(--gold);
            color: var(--gold-light);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 10px rgba(240, 208, 96, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--red), var(--red-light));
            border-color: var(--gold-light);
            box-shadow: 0 0 20px rgba(212, 160, 23, 0.2);
        }

        .btn:active {
            background: var(--red-dark);
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.3);
        }

        .btn.loading {
            pointer-events: none;
            color: transparent;
            text-shadow: none;
        }

        .btn.loading::after {
            content: '★';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--gold-light);
            animation: spinStar 0.8s linear infinite;
        }

        @keyframes spinStar {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.05);
        }

        .result-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .result-title.zero {
            color: var(--gold);
            text-shadow: 0 0 15px rgba(212, 160, 23, 0.3);
        }

        .result-title.not-zero {
            color: var(--red-light);
        }

        .result-detail {
            font-size: 13px;
            color: #998877;
            line-height: 1.8;
            margin-top: 16px;
        }

        .result-detail span {
            color: var(--gold);
        }

        .steps {
            margin-top: 20px;
            text-align: left;
            font-size: 12px;
            color: #776655;
            line-height: 2;
        }

        .steps .step-num {
            color: var(--gold);
            margin-right: 4px;
        }

        .divider {
            text-align: center;
            color: #553333;
            font-size: 11px;
            letter-spacing: 3px;
            margin: 20px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '★';
            margin: 0 10px;
            font-size: 8px;
            color: var(--gold);
            opacity: 0.5;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: #553333;
            letter-spacing: 2px;
            margin-top: 40px;
        }

        /* 五角星装饰 */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            color: var(--gold);
            opacity: 0;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            .card {
                padding: 24px 16px;
            }
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景星星 -->
    <div class="stars-bg" id="starsBg"></div>

    <div class="container">
        <div class="header">
            <div class="icon">★</div>
            <h1>对合环 · 姓名配对</h1>
            <div class="subtitle">基于对合环V2.0 + NG规则 + 69归零</div>
        </div>

        <div class="card">
            <div class="input-group">
                <div class="input-wrapper">
                    <label>姓名 A</label>
                    <input type="text" id="nameA" placeholder="输入姓名" maxlength="10">
                </div>
                <div class="plus">★</div>
                <div class="input-wrapper">
                    <label>姓名 B</label>
                    <input type="text" id="nameB" placeholder="输入姓名" maxlength="10">
                </div>
            </div>
            <button class="btn" id="checkBtn" onclick="checkPair()">开 始 验 算</button>
        </div>

        <div class="result" id="result">
            <div class="result-card">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-title" id="resultTitle"></div>
                <div class="result-detail" id="resultDetail"></div>
                <div class="steps" id="steps"></div>
            </div>
        </div>

        <div class="footer">
            ★ 纯属娱乐 · 切勿当真 · 对合环加密系统 V9.0 ★
        </div>
    </div>

    <script>
        // 生成背景星星
        (function() {
            const bg = document.getElementById('starsBg');
            const stars = '★☆✯✪✶✷✹✺';
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = stars[Math.floor(Math.random() * stars.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = (8 + Math.random() * 16) + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 4) + 's';
                bg.appendChild(star);
            }
        })();

        // ========================================
        // 对合数字映射表（对合环V2.0）
        // ========================================
        const HEHE_MAP = {
            'a': [3], 'b': [8], 'c': [6], 'd': [3, 8], 'e': [3],
            'f': [6], 'g': [3, 9], 'h': [4], 'i': [3], 'j': [2],
            'k': [4], 'l': [7], 'm': [2, 9], 'n': [3, 8], 'o': [3],
            'p': [9], 'q': [8], 'r': [2, 3], 's': [2], 't': [6],
            'u': [5], 'v': [5], 'w': [5], 'x': [10], 'y': [3], 'z': [2, 5],
            'A': [5], 'B': [8], 'C': [6], 'D': [0], 'E': [3],
            'F': [6], 'G': [9], 'H': [4], 'I': [1], 'J': [2, 9],
            'K': [4], 'L': [7], 'M': [2], 'N': [5, 8], 'O': ['/0'],
            'P': [9], 'Q': [8], 'R': [2, 7], 'S': [2], 'T': [6],
            'U': [5], 'V': [5], 'W': [5], 'X': [10], 'Y': [1, 5, 6], 'Z': [2, 5]
        };

        const NG_LIST = ['ang', 'iang', 'uang', 'eng', 'ing', 'ueng', 'ong', 'iong'];

        function getPinyin(char) {
            const map = {
                '赵':'zhao','钱':'qian','孙':'sun','李':'li','周':'zhou','吴':'wu','郑':'zheng','王':'wang',
                '冯':'feng','陈':'chen','褚':'chu','卫':'wei','蒋':'jiang','沈':'shen','韩':'han','杨':'yang',
                '朱':'zhu','秦':'qin','尤':'you','许':'xu','何':'he','吕':'lv','施':'shi','张':'zhang',
                '孔':'kong','曹':'cao','严':'yan','华':'hua','金':'jin','魏':'wei','陶':'tao','姜':'jiang',
                '戚':'qi','谢':'xie','邹':'zou','喻':'yu','柏':'bai','水':'shui','窦':'dou','章':'zhang',
                '云':'yun','苏':'su','潘':'pan','葛':'ge','奚':'xi','范':'fan','彭':'peng','郎':'lang',
                '鲁':'lu','韦':'wei','昌':'chang','马':'ma','苗':'miao','凤':'feng','花':'hua','方':'fang',
                '俞':'yu','任':'ren','袁':'yuan','柳':'liu','酆':'feng','鲍':'bao','史':'shi','唐':'tang',
                '费':'fei','廉':'lian','岑':'cen','薛':'xue','雷':'lei','贺':'he','倪':'ni','汤':'tang',
                '滕':'teng','殷':'yin','罗':'luo','毕':'bi','郝':'hao','邬':'wu','安':'an','常':'chang',
                '乐':'le','于':'yu','时':'shi','傅':'fu','皮':'pi','卞':'bian','齐':'qi','康':'kang',
                '伍':'wu','余':'yu','元':'yuan','卜':'bu','顾':'gu','孟':'meng','平':'ping','黄':'huang',
                '和':'he','穆':'mu','萧':'xiao','尹':'yin','姚':'yao','邵':'shao','湛':'zhan','汪':'wang',
                '祁':'qi','毛':'mao','禹':'yu','狄':'di','米':'mi','贝':'bei','明':'ming','臧':'zang',
                '计':'ji','伏':'fu','成':'cheng','戴':'dai','谈':'tan','宋':'song','茅':'mao','庞':'pang',
                '熊':'xiong','纪':'ji','舒':'shu','屈':'qu','项':'xiang','祝':'zhu','董':'dong','梁':'liang',
                '杜':'du','阮':'ruan','蓝':'lan','闵':'min','席':'xi','季':'ji','麻':'ma','强':'qiang',
                '贾':'jia','路':'lu','娄':'lou','危':'wei','江':'jiang','童':'tong','颜':'yan','郭':'guo',
                '梅':'mei','盛':'sheng','林':'lin','刁':'diao','钟':'zhong','徐':'xu','邱':'qiu','骆':'luo',
                '高':'gao','夏':'xia','蔡':'cai','田':'tian','樊':'fan','胡':'hu','凌':'ling','霍':'huo',
                '虞':'yu','万':'wan','支':'zhi','柯':'ke','昝':'zan','管':'guan','卢':'lu','莫':'mo',
                '经':'jing','房':'fang','裘':'qiu','缪':'miao','干':'gan','解':'xie','应':'ying','宗':'zong',
                '丁':'ding','宣':'xuan','贲':'ben','邓':'deng','郁':'yu','单':'shan','杭':'hang','洪':'hong',
                '包':'bao','诸':'zhu','左':'zuo','石':'shi','崔':'cui','吉':'ji','钮':'niu','龚':'gong',
                '程':'cheng','嵇':'ji','邢':'xing','滑':'hua','裴':'pei','陆':'lu','荣':'rong','翁':'weng',
                '荀':'xun','羊':'yang','於':'yu','惠':'hui','甄':'zhen','麴':'qu','家':'jia','封':'feng',
                '芮':'rui','羿':'yi','储':'chu','靳':'jin','汲':'ji','邴':'bing','糜':'mi','松':'song',
                '井':'jing','段':'duan','富':'fu','巫':'wu','乌':'wu','焦':'jiao','巴':'ba','弓':'gong',
                '牧':'mu','隗':'wei','山':'shan','谷':'gu','车':'che','侯':'hou','宓':'mi','蓬':'peng',
                '全':'quan','郗':'xi','班':'ban','仰':'yang','秋':'qiu','仲':'zhong','伊':'yi','宫':'gong',
                '宁':'ning','仇':'qiu','栾':'luan','暴':'bao','甘':'gan','钭':'tou','厉':'li','戎':'rong',
                '祖':'zu','武':'wu','符':'fu','刘':'liu','景':'jing','詹':'zhan','束':'shu','龙':'long',
                '叶':'ye','幸':'xing','司':'si','韶':'shao','郜':'gao','黎':'li','蓟':'ji','薄':'bo',
                '印':'yin','宿':'su','白':'bai','怀':'huai','蒲':'pu','邰':'tai','从':'cong','鄂':'e',
                '索':'suo','咸':'xian','籍':'ji','赖':'lai','卓':'zhuo','蔺':'lin','屠':'tu','蒙':'meng',
                '池':'chi','乔':'qiao','阴':'yin','鬱':'yu','胥':'xu','能':'neng','苍':'cang','双':'shuang',
                '闻':'wen','莘':'shen','党':'dang','翟':'zhai','谭':'tan','贡':'gong','劳':'lao','逄':'pang',
                '姬':'ji','申':'shen','扶':'fu','堵':'du','冉':'ran','宰':'zai','郦':'li','雍':'yong',
                '卻':'que','璩':'qu','桑':'sang','桂':'gui','濮':'pu','牛':'niu','寿':'shou','通':'tong',
                '边':'bian','扈':'hu','燕':'yan','冀':'ji','郏':'jia','浦':'pu','尚':'shang','农':'nong',
                '温':'wen','别':'bie','庄':'zhuang','晏':'yan','柴':'chai','瞿':'qu','阎':'yan','充':'chong',
                '慕':'mu','连':'lian','茹':'ru','习':'xi','宦':'huan','艾':'ai','鱼':'yu','容':'rong',
                '向':'xiang','古':'gu','易':'yi','慎':'shen','戈':'ge','廖':'liao','庾':'yu','终':'zhong',
                '暨':'ji','居':'ju','衡':'heng','步':'bu','都':'du','耿':'geng','满':'man','弘':'hong',
                '匡':'kuang','国':'guo','文':'wen','寇':'kou','广':'guang','禄':'lu','阙':'que','东':'dong',
                '欧':'ou','殳':'shu','沃':'wo','利':'li','蔚':'wei','越':'yue','夔':'kui','隆':'long',
                '师':'shi','巩':'gong','厍':'she','聂':'nie','晁':'chao','勾':'gou','敖':'ao','融':'rong',
                '冷':'leng','訾':'zi','辛':'xin','阚':'kan','那':'na','简':'jian','饶':'rao','空':'kong',
                '曾':'zeng','母':'mu','沙':'sha','乜':'nie','养':'yang','鞠':'ju','须':'xu','丰':'feng',
                '巢':'chao','关':'guan','蒯':'kuai','相':'xiang','查':'zha','后':'hou','荆':'jing','红':'hong',
                '游':'you','竺':'zhu','权':'quan','逯':'lu','盖':'gai','益':'yi','桓':'huan','公':'gong',
                '泽':'ze','近':'jin','平':'ping','丽':'li','媛':'yuan','恩':'en','来':'lai','超':'chao',
                '德':'de','克':'ke','清':'qing','少':'shao','奇':'qi','光':'mei','小':'xiao','若':'ruo',
                '木':'mu','瑞':'rui','荣':'rong','桓':'huan','月':'yue','琴':'qin','开':'kai','慧':'hui',
                '子':'zi','珍':'zhen','青':'qing','静':'jing','红':'hong','磊':'lei','琳':'lin',
                '鑫':'xin','淼':'miao','森':'sen','焱':'yan','垚':'yao','晶':'jing','品':'pin','众':'zhong',
                '刚':'gang','光':'guang','明':'ming','敏':'min','杰':'jie','军':'jun','鹏':'peng',
                '飞':'fei','婷':'ting','超':'chao','涛':'tao','悦':'yue','果':'guo',
            };
            return map[char] || '';
        }

        function getConsonantFromPinyin(pinyin) {
            if (!pinyin) return '';
            let clean = pinyin.replace(/[1-4]/g, '');
            for (let ng of NG_LIST) {
                if (clean.endsWith(ng)) {
                    clean = clean.slice(0, -ng.length);
                    break;
                }
            }
            if (!clean) return '';
            return clean[0];
        }

        function extractConsonants(name) {
            let consonants = '';
            for (let char of name) {
                let pinyin = getPinyin(char);
                if (pinyin) {
                    let c = getConsonantFromPinyin(pinyin);
                    if (c) consonants += c;
                }
            }
            return consonants;
        }

        function toHeheNumbers(consonants) {
            let upper = consonants.toUpperCase();
            let numbers = [];
            let details = [];
            for (let ch of upper) {
                if (HEHE_MAP[ch]) {
                    let nums = HEHE_MAP[ch];
                    let chosen = nums[0];
                    if (nums.includes(9)) chosen = 9;
                    if (nums.includes(6) && !nums.includes(9)) chosen = 6;
                    numbers.push(chosen);
                    details.push(`${ch}→${chosen}`);
                } else {
                    details.push(`${ch}→?`);
                }
            }
            return { numbers, details };
        }

        function check69(numbers) {
            return numbers.includes(6) && numbers.includes(9);
        }

        function checkPair() {
            const nameA = document.getElementById('nameA').value.trim();
            const nameB = document.getElementById('nameB').value.trim();
            const btn = document.getElementById('checkBtn');
            const resultDiv = document.getElementById('result');

            if (!nameA || !nameB) {
                alert('请输入两个姓名');
                return;
            }

            btn.classList.add('loading');
            btn.textContent = '';

            setTimeout(() => {
                const consA = extractConsonants(nameA);
                const consB = extractConsonants(nameB);
                const combined = consA + consB;
                const { numbers, details } = toHeheNumbers(combined);
                const isZero = check69(numbers);

                showResult(nameA, nameB, consA, consB, combined, details, numbers, isZero);

                btn.classList.remove('loading');
                btn.textContent = '再 测 一 次';
            }, 1200);
        }

        function showResult(nameA, nameB, consA, consB, combined, details, numbers, isZero) {
            const resultDiv = document.getElementById('result');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const detail = document.getElementById('resultDetail');
            const steps = document.getElementById('steps');

            resultDiv.classList.add('show');

            if (isZero) {
                icon.textContent = '★';
                icon.style.color = '#f0d060';
                icon.style.textShadow = '0 0 30px rgba(240, 208, 96, 0.5)';
                title.textContent = '对合归零 · 完全对冲';
                title.className = 'result-title zero';
                detail.innerHTML = `
                    <p>${nameA} 与 ${nameB}</p>
                    <p>在对合环意义上<span>完全对冲</span></p>
                    <p>69归零 · 中心0</p>
                `;
            } else {
                const has6 = numbers.includes(6);
                const has9 = numbers.includes(9);
                let reason = '';
                if (has6 && !has9) reason = '有合(6)无久(9)';
                else if (!has6 && has9) reason = '有久(9)无合(6)';
                else reason = '无合(6)无久(9)';

                icon.textContent = '✶';
                icon.style.color = '#e8384f';
                icon.style.textShadow = '0 0 20px rgba(232, 56, 79, 0.4)';
                title.textContent = '未归零 · ' + reason;
                title.className = 'result-title not-zero';
                detail.innerHTML = `
                    <p>${nameA} 与 ${nameB}</p>
                    <p>对合数字序列：<span>[${numbers.join(', ')}]</span></p>
                    <p>${reason}</p>
                `;
            }

            steps.innerHTML = `
                <div class="divider">验算过程</div>
                <p><span class="step-num">★</span> 辅音骨架：${nameA} → ${consA || '(空)'}，${nameB} → ${consB || '(空)'}</p>
                <p><span class="step-num">★</span> 拼接：${consA} + ${consB} = ${combined || '(空)'}</p>
                <p><span class="step-num">★</span> 对合环第一圈（大写）：${combined.toUpperCase() || '(空)'}</p>
                <p><span class="step-num">★</span> 对合数字：${details.join(', ') || '(无)'}</p>
                <p><span class="step-num">★</span> 69规则：${isZero ? '6和9同时出现 → 归中心0 ★' : '未同时出现6和9 → 未归零'}</p>
            `;

            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPair();
            }
        });
    </script>
</body>
</html>
