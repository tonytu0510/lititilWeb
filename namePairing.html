            margin-bottom: 6px;

            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 2px;

            color: var(--gold);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(212, 167, 116, 0.1);
        }

        .btn:active {
            background: rgba(212, 167, 116, 0.2);
        }

        .btn.loading {
            pointer-events: none;
            color: transparent;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid var(--gold);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {

            }
        }

            display: none;
        }

            display: block;
        }

        // NG拆字：处理三叠字/多叠字
        function ngSplitName(name) {
            let result = '';
            for (let char of name) {
                result += char;
            }
            return result;
        }

        // 提取辅音骨架
        function extractConsonants(name) {
            let consonants = '';
            for (let char of name) {
                let pinyin = getPinyin(char);
                if (pinyin) {
                    let c = getConsonantFromPinyin(pinyin);
                    if (c) consonants += c;
                }
            }
            return consonants;
        }

        // 走对合环：全转大写，查对合数字
        function toHeheNumbers(consonants) {
            let upper = consonants.toUpperCase();
            let numbers = [];
            let details = [];

            for (let ch of upper) {
                if (HEHE_MAP[ch]) {
                    let nums = HEHE_MAP[ch];
                    // 多对合数字的字母，优先取能出6或9的
                    let chosen = nums[0];
                    if (nums.includes(9)) chosen = 9;
                    if (nums.includes(6) && !nums.includes(9)) chosen = 6;
                    numbers.push(chosen);
                    details.push(`${ch}→${chosen}`);
                } else {
                    details.push(`${ch}→?`);
                }
            }

            return { numbers, details };
        }

        // 69归零判断
        function check69(numbers) {
            let has6 = numbers.includes(6);
            let has9 = numbers.includes(9);
            return has6 && has9;
        }

            setTimeout(() => {
                // 提取辅音骨架
                const consA = extractConsonants(nameA);
                const consB = extractConsonants(nameB);
                const combined = consA + consB;

                // 走对合环
                const { numbers, details } = toHeheNumbers(combined);

                // 69判断
                const isZero = check69(numbers);

                // 显示结果
                showResult(nameA, nameB, consA, consB, combined, details, numbers, isZero);

                btn.classList.remove('loading');
                btn.textContent = '再 测 一 次';
            }, 1200);
        }

        function showResult(nameA, nameB, consA, consB, combined, details, numbers, isZero) {
            const resultDiv = document.getElementById('result');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const detail = document.getElementById('resultDetail');
            const steps = document.getElementById('steps');

            resultDiv.classList.add('show');

            if (isZero) {
                icon.textContent = '☯️';
                title.textContent = '对合归零 · 完全对冲';
                title.className = 'result-title zero';
                detail.innerHTML = `
                    <p>${nameA} 与 ${nameB}</p>
                    <p>在对合环意义上<span>完全对冲</span></p>
                    <p>69归零 · 中心0</p>
                `;
            } else {
                const has6 = numbers.includes(6);
                const has9 = numbers.includes(9);
                let reason = '';
                if (has6 && !has9) reason = '有合(6)无久(9)';
                else if (!has6 && has9) reason = '有久(9)无合(6)';
                else reason = '无合(6)无久(9)';

                icon.textContent = '🔮';
                title.textContent = '未归零 · ' + reason;
                title.className = 'result-title not-zero';
                detail.innerHTML = `
                    <p>${nameA} 与 ${nameB}</p>
                    <p>对合数字序列：<span>[${numbers.join(', ')}]</span></p>
                    <p>${reason}</p>
                `;
            }

            steps.innerHTML = `
                <div class="divider">—— 验算过程 ——</div>
                <p><span class="step-num">①</span> 辅音骨架：${nameA} → ${consA || '(空)'}，${nameB} → ${consB || '(空)'}</p>
                <p><span class="step-num">②</span> 拼接：${consA} + ${consB} = ${combined || '(空)'}</p>
                <p><span class="step-num">③</span> 对合环第一圈（大写）：${combined.toUpperCase() || '(空)'}</p>
                <p><span class="step-num">④</span> 对合数字：${details.join(', ') || '(无)'}</p>
                <p><span class="step-num">⑤</span> 69规则：${isZero ? '6和9同时出现 → 归中心0 ✅' : '未同时出现6和9 → 未归零'}</p>
            `;

            // 滚动到结果
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 回车键触发
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPair();
            }
        });
    </script>
</body>
</html>
