<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对合环姓名配对 - 纯属娱乐</title>
    <style>
        :root {
            --bg: #0a0000;
            --card: #1a0000;
            --text: #d4c8b8;
            --gold: #d4a017;
            --gold-light: #f0d060;
            --red: #c41e3a;
            --red-dark: #8b0000;
            --red-light: #e8384f;
            --green: #4a7c59;
            --border: #3a1010;
            --star: #f0d060;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Serif SC", "SimSun", "STSong", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(212, 160, 23, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(196, 30, 58, 0.08) 0%, transparent 60%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
            position: relative;
        }

        /* ========== 国旗装饰区域 ========== */
        .flag-wrapper {
            position: relative;
            width: 200px;
            height: 240px;
            margin: 0 auto 10px auto;
            transform: rotate(0deg);
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
        }

        /* 金色旗杆 倾斜45度 */
        .flag-pole {
            position: absolute;
            bottom: 0;
            left: 30px;
            width: 8px;
            height: 220px;
            background: linear-gradient(180deg, #f0d060, #b8860b, #d4a017);
            border-radius: 4px;
            transform: rotate(-45deg);
            transform-origin: bottom center;
            box-shadow: 0 0 12px rgba(240, 208, 96, 0.5);
            z-index: 10;
        }

        /* 旗杆顶部金色圆球 */
        .flag-pole::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -4px;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 40% 40%, #f0d060, #b8860b);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(240, 208, 96, 0.7);
        }

        /* 红旗面 */
        .flag-cloth {
            position: absolute;
            top: 10px;
            left: 35px;
            width: 140px;
            height: 90px;
            background: linear-gradient(135deg, #c41e3a, #8b0000);
            border: 1px solid #d4a017;
            transform: rotate(-2deg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 5;
        }

        /* 五颗星容器 */
        .stars-container {
            position: absolute;
            top: 14px;
            left: 18px;
            width: 100px;
            height: 60px;
            z-index: 6;
        }

        /* 大五角星 */
        .big-star {
            position: absolute;
            top: 8px;
            left: 4px;
            font-size: 36px;
            color: #f0d060;
            text-shadow: 0 0 18px rgba(240, 208, 96, 0.8);
            z-index: 7;
            animation: glowStar 2s ease-in-out infinite;
        }

        /* 四颗小星 */
        .small-star {
            position: absolute;
            font-size: 14px;
            color: #f0d060;
            text-shadow: 0 0 8px rgba(240, 208, 96, 0.6);
            z-index: 7;
        }
        .small-star:nth-child(2) { top: 4px; left: 46px; }
        .small-star:nth-child(3) { top: 18px; left: 58px; }
        .small-star:nth-child(4) { top: 34px; left: 56px; }
        .small-star:nth-child(5) { top: 44px; left: 42px; }

        @keyframes glowStar {
            0%,100% { text-shadow: 0 0 18px rgba(240,208,96,0.8); }
            50% { text-shadow: 0 0 30px rgba(240,208,96,1); }
        }

        /* 金色流苏 */
        .tassels {
            position: absolute;
            bottom: -18px;
            left: -2px;
            width: 144px;
            height: 20px;
            display: flex;
            justify-content: space-around;
            z-index: 8;
        }

        .tassel {
            width: 2px;
            height: 20px;
            background: linear-gradient(180deg, #d4a017, #f0d060, #b8860b);
            border-radius: 0 0 2px 2px;
            box-shadow: 0 0 6px rgba(240,208,96,0.5);
            animation: sway 1.5s ease-in-out infinite;
        }
        .tassel:nth-child(odd) { animation-delay: 0s; }
        .tassel:nth-child(even) { animation-delay: 0.75s; }

        @keyframes sway {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }

        /* ========== 标题区域 ========== */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header .icon {
            font-size: 0px; /* 隐藏原有图标，国旗代替 */
        }

        .header h1 {
            font-size: 24px;
            color: var(--gold);
            letter-spacing: 4px;
            font-weight: normal;
            margin-top: 5px;
        }

        .header .subtitle {
            font-size: 12px;
            color: #886644;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.05);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .input-group .plus {
            color: var(--gold);
            font-size: 20px;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper label {
            display: block;
            font-size: 11px;
            color: #996644;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px;
            background: #0d0000;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(212, 160, 23, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #442222;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--red-dark), var(--red));
            border: 1px solid var(--gold);
            color: var(--gold-light);
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 10px rgba(240, 208, 96, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--red), var(--red-light));
            border-color: var(--gold-light);
            box-shadow: 0 0 20px rgba(212, 160, 23, 0.2);
        }

        .btn:active {
            background: var(--red-dark);
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.3);
        }

        .btn.loading {
            pointer-events: none;
            color: transparent;
            text-shadow: none;
        }

        .btn.loading::after {
            content: '★';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--gold-light);
            animation: spinStar 0.8s linear infinite;
        }

        @keyframes spinStar {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.05);
        }

        .result-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .result-title.zero {
            color: var(--gold);
            text-shadow: 0 0 15px rgba(212, 160, 23, 0.3);
        }

        .result-title.not-zero {
            color: var(--red-light);
        }

        .result-detail {
            font-size: 13px;
            color: #998877;
            line-height: 1.8;
            margin-top: 16px;
        }

        .result-detail span {
            color: var(--gold);
        }

        .steps {
            margin-top: 20px;
            text-align: left;
            font-size: 12px;
            color: #776655;
            line-height: 2;
        }

        .steps .step-num {
            color: var(--gold);
            margin-right: 4px;
        }

        .divider {
            text-align: center;
            color: #553333;
            font-size: 11px;
            letter-spacing: 3px;
            margin: 20px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '★';
            margin: 0 10px;
            font-size: 8px;
            color: var(--gold);
            opacity: 0.5;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: #553333;
            letter-spacing: 2px;
            margin-top: 40px;
        }

        /* 背景星星 */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            color: var(--gold);
            opacity: 0;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            .card {
                padding: 24px 16px;
            }
            .header h1 {
                font-size: 20px;
            }
            .flag-wrapper {
                width: 160px;
                height: 200px;
            }
            .flag-cloth {
                width: 110px;
                height: 70px;
            }
            .big-star {
                font-size: 28px;
            }
            .small-star {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景星星 -->
    <div class="stars-bg" id="starsBg"></div>

    <div class="container">
        <!-- 国旗装饰 -->
        <div class="flag-wrapper">
            <div class="flag-pole"></div>
            <div class="flag-cloth">
                <div class="stars-container">
                    <span class="big-star">★</span>
                    <span class="small-star">★</span>
                    <span class="small-star">★</span>
                    <span class="small-star">★</span>
                    <span class="small-star">★</span>
                </div>
                <div class="tassels">
                    <div class="tassel"></div><div class="tassel"></div><div class="tassel"></div>
                    <div class="tassel"></div><div class="tassel"></div><div class="tassel"></div>
                    <div class="tassel"></div><div class="tassel"></div><div class="tassel"></div>
                    <div class="tassel"></div><div class="tassel"></div><div class="tassel"></div>
                    <div class="tassel"></div><div class="tassel"></div><div class="tassel"></div>
                </div>
            </div>
        </div>

        <div class="header">
            <div class="icon"></div>
            <h1>对合环 · 姓名配对</h1>
            <div class="subtitle">基于对合环V2.0 + NG规则 + 69归零</div>
        </div>

        <div class="card">
            <div class="input-group">
                <div class="input-wrapper">
                    <label>姓名 A</label>
                    <input type="text" id="nameA" placeholder="输入姓名" maxlength="10">
                </div>
                <div class="plus">★</div>
                <div class="input-wrapper">
                    <label>姓名 B</label>
                    <input type="text" id="nameB" placeholder="输入姓名" maxlength="10">
                </div>
            </div>
            <button class="btn" id="checkBtn" onclick="checkPair()">开 始 验 算</button>
        </div>

        <div class="result" id="result">
            <div class="result-card">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-title" id="resultTitle"></div>
                <div class="result-detail" id="resultDetail"></div>
                <div class="steps" id="steps"></div>
            </div>
        </div>

        <div class="footer">
            ★ 纯属娱乐 · 切勿当真 · 对合环加密系统 V9.0 ★
        </div>
    </div>

    <script>
        (function() {
            const bg = document.getElementById('starsBg');
            const stars = '★☆✯✪✶✷✹✺';
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = stars[Math.floor(Math.random() * stars.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = (8 + Math.random() * 16) + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 4) + 's';
                bg.appendChild(star);
            }
        })();

        const HEHE_MAP = {
            'a':[3],'b':[8],'c':[6],'d':[3,8],'e':[3],'f':[6],'g':[3,9],'h':[4],'i':[3],'j':[2],
            'k':[4],'l':[7],'m':[2,9],'n':[3,8],'o':[3],'p':[9],'q':[8],'r':[2,3],'s':[2],'t':[6],
            'u':[5],'v':[5],'w':[5],'x':[10],'y':[3],'z':[2,5],
            'A':[5],'B':[8],'C':[6],'D':[0],'E':[3],'F':[6],'G':[9],'H':[4],'I':[1],'J':[2,9],
            'K':[4],'L':[7],'M':[2],'N':[5,8],'O':['/0'],'P':[9],'Q':[8],'R':[2,7],'S':[2],'T':[6],
            'U':[5],'V':[5],'W':[5],'X':[10],'Y':[1,5,6],'Z':[2,5]
        };
        const NG_LIST = ['ang','iang','uang','eng','ing','ueng','ong','iong'];

        function getPinyin(c){const m={
            '赵':'zhao','钱':'qian','孙':'sun','李':'li','周':'zhou','吴':'wu','郑':'zheng','王':'wang',
            '冯':'feng','陈':'chen','卫':'wei','蒋':'jiang','沈':'shen','韩':'han','杨':'yang','朱':'zhu',
            '秦':'qin','许':'xu','何':'he','吕':'lv','张':'zhang','孔':'kong','曹':'cao','严':'yan',
            '华':'hua','金':'jin','魏':'wei','陶':'tao','姜':'jiang','谢':'xie','邹':'zou','喻':'yu',
            '苏':'su','潘':'pan','葛':'ge','范':'fan','彭':'peng','鲁':'lu','马':'ma','方':'fang',
            '俞':'yu','任':'ren','袁':'yuan','柳':'liu','史':'shi','唐':'tang','薛':'xue','雷':'lei',
            '贺':'he','罗':'luo','郝':'hao','常':'chang','于':'yu','齐':'qi','康':'kang','顾':'gu',
            '黄':'huang','萧':'xiao','姚':'yao','汪':'wang','毛':'mao','狄':'di','米':'mi','戴':'dai',
            '宋':'song','庞':'pang','熊':'xiong','纪':'ji','董':'dong','梁':'liang','杜':'du','贾':'jia',
            '江':'jiang','郭':'guo','林':'lin','钟':'zhong','徐':'xu','高':'gao','蔡':'cai','田':'tian',
            '胡':'hu','凌':'ling','万':'wan','卢':'lu','邓':'deng','洪':'hong','石':'shi','龚':'gong',
            '程':'cheng','陆':'lu','荣':'rong','段':'duan','焦':'jiao','谷':'gu','侯':'hou','刘':'liu',
            '龙':'long','叶':'ye','白':'bai','卓':'zhuo','屠':'tu','蒙':'meng','习':'xi','居':'ju',
            '耿':'geng','国':'guo','东':'dong','聂':'nie','关':'guan','红':'hong','刚':'gang','光':'guang',
            '明':'ming','敏':'min','杰':'jie','军':'jun','鹏':'peng','飞':'fei','婷':'ting','涛':'tao',
            '悦':'yue','果':'guo','泽':'ze','近':'jin','平':'ping','丽':'li','媛':'yuan','恩':'en',
            '来':'lai','超':'chao','德':'de','克':'ke','清':'qing','少':'shao','奇':'qi','美':'mei',
            '小':'xiao','若':'ruo','木':'mu','瑞':'rui','月':'yue','琴':'qin','开':'kai','慧':'hui',
            '子':'zi','珍':'zhen','青':'qing','静':'jing','磊':'lei','琳':'lin','鑫':'xin','淼':'miao',
            '森':'sen','焱':'yan','垚':'yao','晶':'jing','品':'pin','众':'zhong','皇':'huang','后':'hou',
            '棣':'di','妙':'miao','云':'yun','彻':'che','夫':'fu','刚':'gang'
        };return m[c]||'';}

        function getConsonantFromPinyin(p){if(!p)return'';let c=p.replace(/[1-4]/g,'');for(let ng of NG_LIST){if(c.endsWith(ng)){c=c.slice(0,-ng.length);break;}}if(!c)return'';return c[0];}
        function extractConsonants(n){let r='';for(let c of n){let p=getPinyin(c);if(p){let co=getConsonantFromPinyin(p);if(co)r+=co;}}return r;}
        function toHeheNumbers(c){let u=c.toUpperCase();let n=[],d=[];for(let ch of u){if(HEHE_MAP[ch]){let ns=HEHE_MAP[ch];let chosen=ns[0];if(ns.includes(9))chosen=9;if(ns.includes(6)&&!ns.includes(9))chosen=6;n.push(chosen);d.push(`${ch}→${chosen}`);}else{d.push(`${ch}→?`);}}return{numbers:n,details:d};}
        function check69(n){return n.includes(6)&&n.includes(9);}

        function checkPair(){
            const a=document.getElementById('nameA').value.trim(),b=document.getElementById('nameB').value.trim();
            const btn=document.getElementById('checkBtn'),res=document.getElementById('result');
            if(!a||!b){alert('请输入两个姓名');return;}
            btn.classList.add('loading');btn.textContent='';
            setTimeout(()=>{
                const ca=extractConsonants(a),cb=extractConsonants(b),co=ca+cb;
                const{numbers,details}=toHeheNumbers(co);const iz=check69(numbers);
                showResult(a,b,ca,cb,co,details,numbers,iz);
                btn.classList.remove('loading');btn.textContent='再 测 一 次';
            },1200);
        }

        function showResult(a,b,ca,cb,co,details,numbers,iz){
            const rd=document.getElementById('result'),ic=document.getElementById('resultIcon');
            const ti=document.getElementById('resultTitle'),de=document.getElementById('resultDetail');
            const st=document.getElementById('steps');rd.classList.add('show');
            if(iz){
                ic.textContent='★';ic.style.color='#f0d060';ic.style.textShadow='0 0 30px rgba(240,208,96,0.5)';
                ti.textContent='对合归零 · 完全对冲';ti.className='result-title zero';
                de.innerHTML=`<p>${a} 与 ${b}</p><p>在对合环意义上<span>完全对冲</span></p><p>69归零 · 中心0</p>`;
            }else{
                const h6=numbers.includes(6),h9=numbers.includes(9);let r='';
                if(h6&&!h9)r='有合(6)无久(9)';else if(!h6&&h9)r='有久(9)无合(6)';else r='无合(6)无久(9)';
                ic.textContent='✶';ic.style.color='#e8384f';ic.style.textShadow='0 0 20px rgba(232,56,79,0.4)';
                ti.textContent='未归零 · '+r;ti.className='result-title not-zero';
                de.innerHTML=`<p>${a} 与 ${b}</p><p>对合数字序列：<span>[${numbers.join(', ')}]</span></p><p>${r}</p>`;
            }
            st.innerHTML=`
                <div class="divider">验算过程</div>
                <p><span class="step-num">★</span> 辅音骨架：${a} → ${ca||'(空)'}，${b} → ${cb||'(空)'}</p>
                <p><span class="step-num">★</span> 拼接：${ca} + ${cb} = ${co||'(空)'}</p>
                <p><span class="step-num">★</span> 对合环第一圈（大写）：${co.toUpperCase()||'(空)'}</p>
                <p><span class="step-num">★</span> 对合数字：${details.join(', ')||'(无)'}</p>
                <p><span class="step-num">★</span> 69规则：${iz?'6和9同时出现 → 归中心0 ★':'未同时出现6和9 → 未归零'}</p>
            `;
            rd.scrollIntoView({behavior:'smooth',block:'center'});
        }
        document.addEventListener('keydown',function(e){if(e.key==='Enter')checkPair();});
    </script>
</body>
</html>
