<!DOCTYPE html>

<title>strokeTool · 拆字全流程</title>
<style>
  body {
    background: #1a1a1a;
    color: #ddd;
    font-family: 'Courier New', monospace;
    margin: 0;
    padding: 20px;
    line-height: 1.7;
  }
  h1 { font-size: 18px; color: #7cb8b8; margin: 0 0 4px 0; }
  .sub { color: #666; font-size: 12px; margin-bottom: 20px; }
  .panel {
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%;
    min-height: 80px;
    background: #0d0d0d;
    color: #ddd;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 10px;
    font-family: inherit;
    font-size: 15px;
    resize: vertical;
    box-sizing: border-box;
  }
  button {
    background: #2a2a2a;
    color: #ddd;
    border: 1px solid #555;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    margin-right: 8px;
    margin-top: 8px;
  }
  button:hover { background: #3d3d3d; }
  button.primary { background: #7cb8b8; color: #0d0d0d; border-color: #7cb8b8; }
  button.primary:hover { background: #8fc8c8; }
  pre {
    background: #0d0d0d;
    padding: 14px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.7;
    overflow-x: auto;
    color: #b0d0d0;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .step { color: #7cb8b8; font-weight: bold; }
  .hit { color: #f9ed69; }
  .gone { color: #666; text-decoration: line-through; }
  .empty { color: #9c9; }
  .warn { color: #e88; }
  .note { color: #666; font-size: 12px; }
  .yue { color: #9c9; font-weight: bold; }
  .duo { color: #e88; }
  .pian { color: #7cb8b8; }
  .plain { color: #888; }
  .rare { color: #555; font-size: 11px; }
  .candidate {
    display: inline-block;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 2px 8px;
    margin: 2px;
    font-size: 15px;
  }
  .candidate.yue { background: #1a3320; border-color: #9c9; }
  .candidate.yan { background: #1a2a33; border-color: #7cb8b8; }
  .candidate.both { background: #332a1a; border-color: #f9ed69; }
  .candidate.rare { opacity: 0.5; }
  .chain-yue { color: #9c9; font-weight: bold; background: #1a3320; padding: 0 4px; border-radius: 3px; }
  .blank {
    color: #f9ed69;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<h1>strokeTool · 拆字全流程</h1>
<div class="sub">去标点 → 相同字约掉 → 查古音/多音字/曰/言（有则保留）→ 自对合约掉 → 展开拆解链 → 落一丨十 → 约分 → 归空</div>

<div class="panel">
  <textarea id="input" placeholder="输入一句话，例如：你可以大度的去原谅别人">你可以大度的去原谅别人</textarea>
  <div>
    <button class="primary" id="btnRun">开始拆解</button>
    <button id="btnClear">清空</button>
    <button id="btnSample">示例</button>
  </div>
</div>

<pre id="output">等待输入…</pre>

// ============================================================
// 工具函数
// ============================================================
function splitToStrokes(char, depth) {
  depth = depth || 0;
  if (depth > 10) return [char];
  if (KONG.has(char)) return [char];
  if (CHAR_SPLIT[char]) {
    const result = [];
    const parts = CHAR_SPLIT[char];
    for (let i = 0; i < parts.length; i++) {
      const sub = splitToStrokes(parts[i], depth + 1);
      for (let j = 0; j < sub.length; j++) result.push(sub[j]);
    }
    return result;
  }
  return [char];
}

function containsPart(char, target, depth) {
  depth = depth || 0;
  if (depth > 10) return false;
  if (char === target) return true;
  if (CHAR_SPLIT[char]) {
    const parts = CHAR_SPLIT[char];
    for (let i = 0; i < parts.length; i++) {
      if (parts[i] === char) continue;
      if (containsPart(parts[i], target, depth + 1)) return true;
    }
  }
  return false;
}

function containsYue(char) {
  return containsPart(char, '曰') || containsPart(char, '月');
}

function containsYan(char) {
  return containsPart(char, '言') || containsPart(char, '讠');
}

function hasYue(char) {
  if (DUOYIN[char] && DUOYIN[char].hasYue) return true;
  return containsYue(char);
}

function hasYan(char) {
  if (DUOYIN[char] && DUOYIN[char].hasYan) return true;
  const pps = PIANPANG[char] || [];
  return pps.indexOf('言') !== -1 || pps.indexOf('讠') !== -1 || containsYan(char);
}

function findDuoyin(char) {
  return DUOYIN[char] || null;
}

function hasAncient(char) {
  return !!(ANCIENT_READ[char] && ANCIENT_READ[char].length);
}

function isRare(char) {
  return !COMMON_CHARS.has(char);
}

function stripTone(pinyin) {
  const map = {
    'ā':'a','á':'a','ǎ':'a','à':'a',
    'ē':'e','é':'e','ě':'e','è':'e',
    'ī':'i','í':'i','ǐ':'i','ì':'i',
    'ō':'o','ó':'o','ǒ':'o','ò':'o',
    'ū':'u','ú':'u','ǔ':'u','ù':'u',
    'ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v',
    'ń':'n','ň':'n','ǹ':'n'
  };
  let out = '';
  for (const c of pinyin) out += map[c] || c;
  return out;
}

// ============================================================
// 展开拆解链
// ============================================================
function expandChain(char, depth, lines, parentPrefix) {
  depth = depth || 0;
  lines = lines || [];
  parentPrefix = parentPrefix || '';
  if (depth > 8) return lines;

  const parts = CHAR_SPLIT[char];
  if (!parts) {
    lines.push(parentPrefix + char + ' （无拆解）');
    return lines;
  }

  parts.forEach(function(part, i) {
    const isLast = i === parts.length - 1;
    const branch = isLast ? '└─ ' : '├─ ';
    const nextPrefix = parentPrefix + (isLast ? '   ' : '│  ');

    const isYue = part === '曰';
    const isYan = part === '言' || part === '讠';
    let mark = '';
    if (isYue) mark = ' <span class="chain-yue">← 出现曰</span>';
    else if (isYan) mark = ' <span class="yan">← 言字旁</span>';

    lines.push(parentPrefix + branch + part + mark);
    if (CHAR_SPLIT[part] && part !== char) {
      expandChain(part, depth + 1, lines, nextPrefix);
    }
  });

  return lines;
}

function findYueNext(char, depth) {
  depth = depth || 0;
  if (depth > 10) return null;
  const parts = CHAR_SPLIT[char];
  if (!parts) return null;
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === '曰') {
      if (i + 1 < parts.length) return parts[i + 1];
      return '一';
    }
  }
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === char) continue;
    const r = findYueNext(parts[i], depth + 1);
    if (r) return r;
  }
  return null;
}

// ============================================================
// 主流程
// ============================================================
function run() {
  const raw = document.getElementById('input').value;
  const log = [];

  log.push('<span class="step">【输入】</span>');
  log.push('  ' + raw);

  // 第1步：去标点
  log.push('');
  log.push('<span class="step">【第1步：去标点】</span>');
  let noPunct = '';
  for (let i = 0; i < raw.length; i++) {
    if (!PUNCT.has(raw[i])) noPunct += raw[i];
  }
  log.push('  去掉标点后：' + noPunct);

  // 第2步：相同字约掉
  log.push('');
  log.push('<span class="step">【第2步：相同字约掉（任意位置）】</span>');
  const chars = noPunct.split('');
  const count = {};
  chars.forEach(function(c) { count[c] = (count[c] || 0) + 1; });

  const kept = [];
  const removed = [];
  const seen = {};
  chars.forEach(function(c) {
    seen[c] = (seen[c] || 0) + 1;
    if (count[c] % 2 === 1 && seen[c] === count[c]) {
      kept.push(c);
    } else {
      removed.push(c);
    }
  });

  log.push('  原文用字：' + chars.join(' '));
  const cntStr = Object.keys(count).map(function(c) { return c + '×' + count[c]; }).join('  ');
  log.push('  字数统计：' + cntStr);
  log.push('  约掉：' + (removed.length ? removed.map(function(c) { return '<span class="gone">' + c + '</span>'; }).join(' ') : '（无）'));
  log.push('  保留：' + (kept.length ? kept.map(function(c) { return '<span class="hit">' + c + '</span>'; }).join(' ') : '（空）'));

  // 第3步：先查古音/多音字/曰/言，有的不判自对合；没有的再判自对合
  log.push('');
  log.push('<span class="step">【第3步：先查古音/多音字/曰/言，有的保留，没有的判自对合】</span>');

  const kept2 = [];       // 保留的（有古音/多音/曰/言）
  const selfRemoved = []; // 自对合约掉的
  const priorChars = [];  // 走优先路径的字

  kept.forEach(function(c) {
    // 先看有没有优先路径
    const hasPriority =
      hasAncient(c) ||
      findDuoyin(c) ||
      hasYue(c) ||
      hasYan(c);

    if (hasPriority) {
      priorChars.push(c);
      kept2.push(c);
      // 显示判定依据
      const reasons = [];
      if (hasAncient(c)) reasons.push('古音/通假');
      if (findDuoyin(c)) reasons.push('多音字');
      if (hasYue(c)) reasons.push('含曰/月');
      if (hasYan(c)) reasons.push('含言字旁');
      log.push('  <span class="hit">' + c + '</span> 有 [' + reasons.join(' + ') + '] → 保留，不判自对合');
      return;
    }

    // 没有优先路径，再判自对合
    const strokes = splitToStrokes(c);
    let onlySelf = true;
    for (let i = 0; i < strokes.length; i++) {
      if (!KONG.has(strokes[i])) { onlySelf = false; break; }
    }
    if (onlySelf) {
      selfRemoved.push({ char: c, strokes: strokes });
    } else {
      kept2.push(c);
    }
  });

  selfRemoved.forEach(function(item) {
    log.push('  <span class="gone">' + item.char + '</span> = ' + item.strokes.join(' + ') + ' → 自对合 → 归空');
  });
  if (!selfRemoved.length) log.push('  （无自对合字）');
  log.push('  保留：' + (kept2.length ? kept2.map(function(c) { return '<span class="hit">' + c + '</span>'; }).join(' ') : '（空）'));

  // 第4步：找曰 / 多音字 / 偏旁（对保留下来的字分类）
  log.push('');
  log.push('<span class="step">【第4步：对保留的字分类】</span>');

  const yueChars = [];
  const duoyinChars = [];
  const yanChars = [];
  const remaining = [];

  kept2.forEach(function(c) {
    if (hasYue(c)) {
      yueChars.push(c);
    } else if (findDuoyin(c) && hasYan(c)) {
      duoyinChars.push(c);
    } else if (hasYan(c)) {
      yanChars.push(c);
    } else if (hasAncient(c) || findDuoyin(c)) {
      // 有古音/多音字但没有曰/言，也归到 duoyinChars
      duoyinChars.push(c);
    } else {
      remaining.push(c);
    }
  });

  log.push('  <span class="yue">含「曰」的字：</span>' + (yueChars.length ? yueChars.join(' ') : '（无）'));
  log.push('  <span class="duo">含古音/多音字：</span>' + (duoyinChars.length ? duoyinChars.join(' ') : '（无）'));
  log.push('  <span class="pian">含言字旁的字：</span>' + (yanChars.length ? yanChars.join(' ') : '（无）'));
  log.push('  剩下的字：' + (remaining.length ? remaining.join(' ') : '（无）'));

  duoyinChars.forEach(function(c) {
    const d = findDuoyin(c);
    if (d) log.push('    ' + c + ' 读音：' + d.pinyin.join(' / '));
    const a = ANCIENT_READ[c];
    if (a) a.forEach(function(x) { log.push('    ' + c + ' 古音：' + x.pinyin + '  ' + x.note); });
  });

  // 第5步：展开拆解链
  log.push('');
  log.push('<span class="step">【第5步：展开拆解链】</span>');

  const allChars = yueChars.concat(duoyinChars, yanChars, remaining);
  const allStrokes = [];

  allChars.forEach(function(c) {
    const ancient = ANCIENT_READ[c] || [];
    const modern = DUOYIN_MODERN[c] || null;

    if (ancient.length > 0 || hasYue(c) || hasYan(c)) {
      log.push('');
      log.push('  <span class="hit">▸ ' + c + '</span>');

      if (modern) log.push('    现代读音：' + modern.join(' / '));
      if (ancient.length) {
        ancient.forEach(function(a) {
          log.push('    古音/通假：' + c + ' → ' + a.pinyin + '  ' + a.note);
        });
      }

      const chainLines = [];
      chainLines.push('    ' + c);
      expandChain(c, 1, chainLines, '    ');
      log.push(chainLines.join('\n'));

      const yueNext = findYueNext(c);
      if (yueNext) {
        log.push('');
        log.push('    <span class="yue">「曰」后面的部件：</span>' + yueNext);
        log.push('    <span class="blank">请填空：曰 ' + yueNext + ' = ？</span>');
        log.push('    <span class="plain">（这里就是「曰什么」，留白，自己填）</span>');
      }

      const strokes = splitToStrokes(c);
      for (let i = 0; i < strokes.length; i++) allStrokes.push(strokes[i]);
    } else {
      const strokes = splitToStrokes(c);
      log.push('  ' + c + ' → ' + strokes.join(' + '));
      for (let i = 0; i < strokes.length; i++) allStrokes.push(strokes[i]);
    }
  });

  if (!allChars.length) log.push('  （无）');

  // 第6步：约分
  log.push('');
  log.push('<span class="step">【第6步：约分】</span>');

  const sCount = { '一': 0, '丨': 0, '0': 0 };
  const sOthers = {};
  allStrokes.forEach(function(s) {
    if (s in sCount) sCount[s]++;
    else sOthers[s] = (sOthers[s] || 0) + 1;
  });

  log.push('  一：' + sCount['一'] + ' 个');
  log.push('  丨：' + sCount['丨'] + ' 个');
  log.push('  0：' + sCount['0'] + ' 个');

  const pairYiShu = Math.min(sCount['一'], sCount['丨']);
  sCount['一'] -= pairYiShu;
  sCount['丨'] -= pairYiShu;
  if (pairYiShu > 0) {
    log.push('  <span class="hit">一 × 丨 配对约掉 ' + pairYiShu + ' 对</span>');
  }

  const pairZero = Math.floor(sCount['0'] / 2);
  sCount['0'] -= pairZero * 2;
  if (pairZero > 0) {
    log.push('  <span class="hit">0 × 0 配对约掉 ' + pairZero + ' 对</span>');
  }

  const residual = sCount['一'] + sCount['丨'] + sCount['0'];
  if (residual > 0) {
    log.push('  剩余单笔：一×' + sCount['一'] + '  丨×' + sCount['丨'] + '  0×' + sCount['0'] + ' → 归空');
  }

  const otherKeys = Object.keys(sOthers);
  if (otherKeys.length) {
    log.push('  其他笔画：' + otherKeys.map(function(k) { return k + '×' + sOthers[k]; }).join('  ') + ' → 归空');
  }

  // 结果
  log.push('');
  log.push('<span class="step">【最终结果】</span>');
  log.push('  <span class="empty">空 = 空 ✓ 对合上了</span>');

  document.getElementById('output').innerHTML = log.join('\n');
}

// ============================================================
// 事件
// ============================================================
document.getElementById('btnRun').addEventListener('click', run);
document.getElementById('btnClear').addEventListener('click', function() {
  document.getElementById('input').value = '';
  document.getElementById('output').textContent = '等待输入…';
});
document.getElementById('btnSample').addEventListener('click', function() {
  const samples = [
    '你可以大度的去原谅别人',
    '但千万不要愚蠢的再相信',
    '你可以大度的去原谅别人但千万不要愚蠢的再相信'
  ];
  const pick = samples[Math.floor(Math.random() * samples.length)];
  document.getElementById('input').value = pick;
  run();
});

run();
</script>
