<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="./js/meta-config.js"></script>
  <script>
    window.PAGE_META.title = "No · 英文拆字"
    window.PAGE_META.cssFront = ["./css/NoIsaDoor.css"]
  </script>
  </style>
  <script>
    window.PAGE_META.content =
    `
    <div class="wrap">
        <header>
            <h1>No · 英文拆字</h1>
            <p>No 不只是否定，它里面藏着一个 and。</p>
        </header>

        <div class="section">
            <h2>规则</h2>
            <div class="explain">
                <p>No → N + O</p>
                <p>N = and</p>
                <p>O = 0 / 空</p>
                <p>所以 No 后面，常常能拆成：</p>
                <p><span class="highlight">and + 俚语 / and + 反转动作</span></p>
            </div>
        </div>

        <div class="section">
            <h2>警示语拆解</h2>
            <table>
                <thead>
                    <tr>
                        <th>原句</th>
                        <th>拆后</th>
                        <th>意思</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>No Smoking</td>
                        <td>N sok</td>
                        <td>and sucker</td>
                    </tr>
                    <tr>
                        <td>No U-turn</td>
                        <td>N U-turn</td>
                        <td>and U-turn</td>
                    </tr>
                    <tr>
                        <td>No Entry</td>
                        <td>N entry</td>
                        <td>and try</td>
                    </tr>
                    <tr>
                        <td>No Overtaking</td>
                        <td>N over taking</td>
                        <td>and over taking</td>
                    </tr>
                    <tr>
                        <td>No Trespassing</td>
                        <td>N tres passing</td>
                        <td>and trace passing</td>
                    </tr>
                    <tr>
                        <td>No Fly Zone</td>
                        <td>N fly zone</td>
                        <td>and fly zone</td>
                    </tr>
                    <tr>
                        <td>No Fireworks</td>
                        <td>N fire works</td>
                        <td>and fire works</td>
                    </tr>
                    <tr>
                        <td>No Sharp Objects</td>
                        <td>N sharp objects</td>
                        <td>and sharp objects</td>
                    </tr>
                    <tr>
                        <td>No Soliciting</td>
                        <td>N so licit ing</td>
                        <td>and so licit ing</td>
                    </tr>
                    <tr>
                        <td>No Refunds</td>
                        <td>N re funds</td>
                        <td>and re funds</td>
                    </tr>
                    <tr>
                        <td>No Smoking In Bed</td>
                        <td>N smoking in bed</td>
                        <td>and sucker in bed</td>
                    </tr>
                    <tr>
                        <td>No Shoes, No Shirt, No Service</td>
                        <td>N shoes, N shirt, N service</td>
                        <td>and shoes, and shirt, and service</td>
                    </tr>
                </tbody>
            </table>
            <p class="note">大部分符合，不是全部。语言不是数学，能有大半命中，就不是巧合。</p>
        </div>

        <div class="section">
            <h2>为什么用 No，不用 Not</h2>
            <div class="explain">
                <p>Not = N + O + T</p>
                <p>T = 一丨 = 十，太完整，太正式，不容易滑动。</p>
                <p>No = N + O，是开着的口子。</p>
                <p>所以警示牌偏爱 No，不是偶然。</p>
            </div>
        </div>

        <footer>
            No 不是墙，是门。
        </footer>
    </div>
    `
  </script>
  <script src="./js/meta-loader.js"></script>
