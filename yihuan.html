            <h2>大学老师</h2>

        <div class="section">
            <h2>从一到十：一半丨，一伴丨</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>数字</th>
                            <th>一半丨</th>
                            <th>一伴丨</th>

                    </thead>
                    <tbody id="numTable"></tbody>
                </table>

            <p class="note">左边是拆，右边是合。一拆一合，字就出来了。</p>
        </div>

        <div class="section">
            <h2>根本</h2>
            <div class="big-char">一 · 丨</div>
            <div class="explain">
                <p><span class="highlight">一</span> 是横，平着，表示展开、地面、时间。</p>
                <p><span class="highlight">丨</span> 是竖，直着，表示贯通、立起、上下。</p>
                <p>一和丨相交，就成了 <span class="highlight">十</span>。</p>
                <p>十不是十全十美，是横竖相遇的那一个点。</p>
            </div>
        </div>

        <div class="section">
            <h2>一半丨，一伴丨</h2>
            <div class="explain">
                <p><span class="highlight">一半丨</span>：把“丨”分成两半，是拆。</p>
                <p><span class="highlight">一伴丨</span>：让“一”和“丨”作伴，是合。</p>
                <p>一拆一合，就是字的生死。</p>
            </div>
            <div class="explain">
                <p><span class="highlight">卜</span>：十少一横，旁边一点。</p>
                <p><span class="highlight">不</span>：卜上加一横，右边多一点。</p>
                <p><span class="highlight">个</span>：人下一竖。</p>
                <p><span class="highlight">人</span>：八分开，站成两个人。</p>
            </div>
        </div>

        <div class="section">
            <h2>空：从一到空</h2>
            <div class="explain">
                <p><span class="highlight">空</span> 拆开是 <span class="highlight">穴 + 工</span>。</p>
                <p>穴是洞，工是一横一竖一横。</p>
                <p>工里有横有竖，竖就是丨，横就是一。</p>
                <p>所以空不是没有，是一个洞里，放着一横一竖。</p>
            </div>
            <div class="explain">
                <p>空 → 穴 + 工</p>
                <p>工 → 一 + 丨 + 一</p>
                <p>丨 → 1</p>
                <p>一 → 1</p>
                <p>所以空的最里面，还是 1。</p>
            </div>
            <div class="explain">
                <p>也可以倒着推：</p>
                <p>1 → 一</p>
                <p>1 → 丨</p>
                <p>一 + 丨 + 一 → 工</p>
                <p>穴 + 工 → 空</p>
                <p>所以空不是没有，是一和丨在洞里作伴。</p>
            </div>
            <p class="note">空，不是无，是空间里藏着“一”。</p>
        </div>

        <div class="section">
            <h2>色：一丨七</h2>
            <div class="explain">
                <p><span class="highlight">色</span> 拆开是 <span class="highlight">⺈ + 巴</span>。</p>
                <p>但也可以玩成：色 → 一 + 丨 + 7。</p>
                <p>一横、一竖、一个 7。</p>
                <p>7 是数字，也是七。</p>
                <p>所以色不是色，是一丨七。</p>
            </div>
            <div class="explain">
                <p><span class="highlight">色即是空，空即是色。</span></p>
                <p>色拆到最后，是一丨七；空拆到最后，是一丨一。</p>
                <p>一个七，一个一。</p>
                <p>七和一，都是 1。</p>
                <p>所以色和空，最后都回到 1。</p>
            </div>
            <p class="note">色不异空，空不异色。拆到最底，都是 1。</p>
        </div>

        <div class="section">
            <h2>解法一：色空互推，1 = 7</h2>
            <div class="explain">
                <p>空 → 卜丨 → 一 + 1 + 丨</p>
                <p>色 → 一 + 丨 + 7</p>
                <p>其中 <span class="highlight">1 = 7</span></p>
                <p>所以：</p>
                <p>空 = 一 + 丨 + 1 = 一 + 丨 + 7 = 色</p>
            </div>
            <div class="explain">
                <p>也可以反着来：</p>
                <p>色 = 一 + 丨 + 7 = 一 + 丨 + 1 = 空</p>
                <p><span class="highlight">色 → 空 → 色</span></p>
                <p><span class="highlight">空 → 色 → 空</span></p>
            </div>
            <p class="note">1 等于 7，色空就能倒推回去。</p>
        </div>

        <div class="section">

                <p>因为空在数学上等于 0，所以：</p>
                <p><span class="highlight">丨 = 0</span></p>
                <p><span class="highlight">一 = 1</span></p>
                <p><span class="highlight">十 = 10</span></p>
            </div>
            <div class="explain">
                <p>中 = 口 + 丨</p>
                <p>口是空框，丨是 0。</p>
                <p>所以“中”就是：</p>
                <p><span class="highlight">0 站在空框中间。</span></p>
            </div>
            <div class="explain">
                <p>再推：</p>
                <p>日 = 口 + 一 = 框里放 1</p>
                <p>田 = 口 + 一 + 丨 = 框里放 1 和 0</p>
                <p>由 = 田上一横出头</p>
                <p>甲 = 田下一横出头</p>
            </div>
            <p class="note">中、日、田，都是框里放 1 或 0。</p>
        </div>

        <div class="section">
            <h2>七进制：0 到 7</h2>
            <div class="explain">
                <p>这个世界，本质是 7 进制。</p>
                <p>0、1、2、3、4、5、6、7</p>
                <p>到 8 就是 <span class="highlight">00</span></p>
                <p>到 9 就是 <span class="highlight">01</span></p>
            </div>
            <div class="explain">
                <p>所以：</p>
                <p>7 是满，是这一轮的终点。</p>
                <p>1 是初，是这一轮的起点。</p>
                <p>7 再走一步，就是下一轮的 0 或 1。</p>
                <p>1 和 7，在环上是同一个位置。</p>
            </div>
            <div class="explain">
                <p>所以：</p>
                <p><span class="highlight">色即是空，空即是色。</span></p>
                <p>不是比喻，是进制。</p>
            </div>
            <p class="note">1 是头，7 是尾。头尾相接，就是环。</p>
        </div>

        <div class="section">
            <h2>七满进位</h2>
            <div class="explain">
                <p>如果继续往下走：</p>
                <p>8 = 00</p>
                <p>9 = 01</p>
                <p>10 = 9</p>
                <p>11 = 11</p>
                <p>12 = 12</p>
                <p>17 = 17</p>
                <p>18 = 100</p>
                <p>19 = 101</p>
                <p>20 = 20</p>
                <p>21 = 21</p>
                <p>27 = 27</p>
                <p>28 = 200</p>
                <p>29 = 201</p>
            </div>
            <div class="explain">
                <p>规律是：</p>
                <p>个位数到 7 就满，但十位数还是十进制。</p>
                <p>所以 8、18、28 这些位置，都会重新归零。</p>
                <p>8 是 00，18 是 100，28 是 200。</p>
            </div>
            <div class="explain">
                <p>所以这套记法不是标准七进制，也不是八进制。</p>
                <p>它是：</p>
                <p><span class="highlight">十进制外壳 + 七进制内核</span></p>
                <p>数字还是十进制读，但“满”的定义是 7。</p>
                <p>因此叫它：</p>
                <p><span class="highlight">七满进位</span></p>
            </div>
            <p class="note">逢八归零，七满成环。</p>
        </div>

        <div class="section">

            <div class="explain">
                <p>一 伴丨 → <span class="highlight">十</span></p>
                <p>十 变一点 → <span class="highlight">卜</span></p>

                <p>天 出头 → <span class="highlight">夫</span></p>
                <p>夫 收一横成日 → <span class="highlight">日</span></p>
                <p>日 加月 → <span class="highlight">明</span></p>
                <p>明 去月加生 → <span class="highlight">星</span></p>
                <p>星 去生加丨 → <span class="highlight">田</span></p>
                <p>田 下一横 → <span class="highlight">土</span></p>
                <p>土 上加一横 → <span class="highlight">王</span></p>
                <p>土 加也 → <span class="highlight">地</span></p>
                <p>地 拆开，土里有十，十里有丨，丨里有一。</p>
            </div>
        </div>

        <div class="section">
            <h2>主要偏旁咬合</h2>
            <div class="group-box">
                <div class="group-title">亻（人字旁）</div>
                <div class="group-chars">人 → 个 → 大 → 天 → 化 → 什 → 仁 → 仙 → 休 → 体</div>
                <p class="note">人旁的字，都是“人”在左边站着，和右边作伴。</p>
            </div>
            <div class="group-box">
                <div class="group-title">氵（三点水）</div>
                <div class="group-chars">一 → 十 → 土 → 地 → 池 → 河 → 海 → 洋 → 江 → 湖</div>
                <p class="note">水旁的字，是从“地”生出来的水，再流成江河湖海。</p>
            </div>
            <div class="group-box">
                <div class="group-title">木（木字旁）</div>
                <div class="group-chars">十 → 木 → 林 → 森 → 树 → 根 → 枝 → 叶 → 花 → 草</div>
                <p class="note">木从“十”长出来，木多成林，林多成森，再开花长草。</p>
            </div>
            <div class="group-box">
                <div class="group-title">艹（草字头）</div>
                <div class="group-chars">十 → 艹 → 花 → 茶 → 药 → 草 → 苗 → 芽 → 英 → 莲</div>
                <p class="note">草字头就是两个“十”并排，草木都从土里长出来。</p>
            </div>
            <div class="group-box">
                <div class="group-title">口（口字旁）</div>
                <div class="group-chars">一 → 丨 → 口 → 日 → 田 → 由 → 甲 → 申 → 电 → 申</div>
                <p class="note">口是横竖围成框，里面加横就成日、田、由、甲。</p>
            </div>
            <div class="group-box">
                <div class="group-title">忄（心字旁）</div>
                <div class="group-chars">心 → 忄 → 想 → 思 → 念 → 情 → 恨 → 怕 → 慌 → 忙</div>
                <p class="note">心旁的字，都是心里在动，不是拆字，是心动。</p>
            </div>
            <div class="group-box">
                <div class="group-title">讠（言字旁）</div>
                <div class="group-chars">言 → 讠 → 说 → 话 → 记 → 让 → 讲 → 课 → 读 → 诗</div>
                <p class="note">言旁的字，都和说话、文字有关，口里出来的东西。</p>
            </div>
            <div class="group-box">
                <div class="group-title">扌（手字旁）</div>
                <div class="group-chars">手 → 扌 → 打 → 找 → 把 → 拉 → 推 → 接 → 提 → 握</div>
                <p class="note">手旁的字，都是手在做动作，一提一放，都是手。</p>
            </div>
        </div>

        <footer>
            一横一竖，半半伴伴，全在里面转。
        </footer>
    </div>
    `
