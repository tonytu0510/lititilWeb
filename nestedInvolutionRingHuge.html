<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shanna.Li">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>对合环</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="common.css">
    <script src="dino-game.js"></script>
    <style>
        .container{
            padding:0 20px
        }
        .avatar {
            flex-shrink: 0;
        }
        .avatar canvas {
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .info {
            max-width: 1360px;
        }
        .info h2 {
            color: var(--primary);
            margin-top:30px;
            margin-bottom: 30px;
        }
        .info .email {
            font-size: 18px;
            color: var(--text);
            background: var(--light-gray);
            padding: 15px 25px;
            border-radius: 8px;
            display: inline-block;
        }
        .qrCode img{ width: 100%;display: inline-block}
    </style>
<script src="dino-game.js"></script>
</head>
<body>
    <div id="topBarContainer"></div>
    <div class="container">
        <div class="info">
            <h2>对合环</h2>
            <p style="margin-bottom:20px;color:var(--gray);">一个热爱技术与生活的开发者。</p>
            <div class="email qrCode" style="border-radius:0 8px 8px 8px">
                <img src="images/nested_involution_ring_huge.png"/>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // 画卡通头像
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');
        
        // 脸
        ctx.fillStyle = '#ffe0bd';
        ctx.beginPath();
        ctx.arc(100, 100, 80, 0, Math.PI * 2);
        ctx.fill();
        
        // 头发
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(100, 80, 70, Math.PI, 0);
        ctx.fill();
        
        // 眼睛
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(75, 90, 15, 0, Math.PI * 2);
        ctx.arc(125, 90, 15, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(80, 90, 7, 0, Math.PI * 2);
        ctx.arc(130, 90, 7, 0, Math.PI * 2);
        ctx.fill();
        
        // 嘴
        ctx.strokeStyle = '#c4334c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(100, 115, 25, 0.1, Math.PI - 0.1);
        ctx.stroke();
    </script>
</body>
</html>
