        </ul>

          <li>齐心</li>

          <li>开慧 = 开会</li>
          <li>牛逼啊</li>

        <ul>
          <li>上横林，下洛社</li>

          <li>横 = 木 + 黄</li>
          <li>林 = 木 + 木</li>
          <li>洛 = 氵 + 各</li>
          <li>社 = 礻 + 土</li>
          <li>先拆偏旁部首</li>

          <li>洛社：氵、夂、曰、礻、土</li>
          <li>横林里有多音字：横（héng / hèng），含曰</li>
          <li>继续找曰，横林 → 曰</li>
          <li>洛社里没有多音字</li>
          <li>偏旁组不成句，就找部首</li>
          <li>洛社的部首里有曰，洛社 → 曰</li>
          <li>两边都只剩一个曰</li>
          <li>横林曰：在上不傲</li>
          <li>洛社曰：在下不卑</li>

          <li>下曰：在下不卑</li>
          <li>对仗，大白话，人人都懂</li>
          <li>底是：谦虚、诚实</li>
