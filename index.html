<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tony.tu">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>首页</title>
    <link rel="stylesheet" href="common.css">
    <script src="dino-game.js"></script>
    <style>
        #slider {
            width: 100%;
            height: calc(100vh - 50px);
            position: relative;
            overflow: hidden;
            transition: height 0.3s;
            touch-action: pan-y;
        }
        #slider.full {
            height: 100vh;
        }
        .slide {
            width: 100%;
            height: calc(100vh - 50px);
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.6s;
            z-index: 1;
        }
        .slide.active {
            opacity: 1;
            z-index: 2;
        }
        .slide.active:nth-child(6){
            cursor: pointer!important;
        }
        .slide canvas {
            width: 100%;
            height: 100%;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 30px;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 10;
            border-radius: 4px;
            display: none;
        }
        @media (min-width: 768px) {
            .arrow {
                display: block;
            }
        }
        .arrow:hover {
            background: rgba(255,255,255,0.4);
        }
        .arrow.left {
            left: 20px;
        }
        .arrow.right {
            right: 20px;
        }
        #dots {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        #dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: background 0.3s;
        }
        #dots span.active {
            background: #c4334c;
        }
    </style>
</head>
<body>

    <div id="topBarContainer"></div>

    <div id="slider">
        <div class="slide active"><canvas id="canvas1"></canvas></div>
        <div class="slide"><canvas id="canvas2"></canvas></div>
        <div class="slide"><canvas id="canvas3"></canvas></div>
        <div class="slide"><canvas id="canvas4"></canvas></div>
        <div class="slide"><canvas id="canvas5"></canvas></div>
        <div class="slide"><canvas id="canvas6"></canvas></div>
        <div class="slide"><canvas id="canvas7"></canvas></div>

        <button class="arrow left" onclick="prevSlide()">❮</button>
        <button class="arrow right" onclick="nextSlide()">❯</button>
        <div id="dots">
            <span class="active" onclick="goTo(0)"></span>
            <span onclick="goTo(1)"></span>
            <span onclick="goTo(2)"></span>
            <span onclick="goTo(3)"></span>
            <span onclick="goTo(4)"></span>
            <span onclick="goTo(5)"></span>
            <span onclick="goTo(6)"></span>
        </div>
    </div>
    <script src="common.js"></script>
    <script>
        // ==================== 轮播逻辑 ====================
        let current = 0;
        let indexTime = 10000;
        let otherTime = 4200;
        let time = indexTime
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('#dots span');
        const canvas6Event = document.getElementById("canvas6")
        const slider = document.getElementById('slider');
        let TimeOutTimer = null;
        // H5触屏端缩小到0.4，PC端保持1
        let H5Scal = null
        let radioY = null
        let H5PrintFont = null

        function showSlide(n) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            slides[n].classList.add('active');
            dots[n].classList.add('active');
            current = n;
            if(n === 5){
                initMath()
            }
            resetTimer();
        }

        function nextSlide() {
            showSlide((current + 1) % 7);
        }
        function isIndexTime(){
            console.log('current=>',current)
           if(current === 0){
                time = indexTime
            }else{
                time = otherTime
            }
           return time;
        }

        function prevSlide() {
            showSlide((current - 1 + 7) % 7);
        }

        function goTo(n) {
            showSlide(n);
        }

        function initTimer(time){
            console.log('time=>',time)
            clearTimeout(TimeOutTimer)
            TimeOutTimer = setTimeout(function(time){
                  nextSlide()
                  time = isIndexTime()
                  initTimer(time)
            },time)
        }

        function resetTimer() {
            clearTimer()
            time = isIndexTime();
            initTimer(time);
        }
        function clearTimer(){
            clearTimeout(TimeOutTimer);
            TimeOutTimer = null
        }

        initTimer(time)
        //鼠标滑过计时器暂停
        const slideElements = document.getElementsByClassName('slide')
        for(let i=0;i<slideElements.length;i++){
            slideElements[i].onmouseover = function(){
                clearTimer(TimeOutTimer);
            }
            slideElements[i].onmouseout = function(){
                resetTimer(time)
            }
        }

        // ==================== H5触屏手势 ====================
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;

        slider.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchMoved = false;
        }, { passive: true });

        slider.addEventListener('touchmove', function(e) {
            touchMoved = true;
        }, { passive: true });

        slider.addEventListener('touchend', function(e) {
            if (!touchMoved) return;

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const diffX = touchStartX - endX;
            const diffY = touchStartY - endY;

            // 横向滑动超过30px且大于纵向滑动
            if (Math.abs(diffX) > 30 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
                resetTimer();
            }
            touchMoved = false;
        });

        function updateSliderHeight() {
            const dinoBar = document.getElementById('dinoBar');
            if (dinoBar && slider) {
                if (dinoBar.style.display === 'none') {
                    slider.classList.add('full');
                } else {
                    slider.classList.remove('full');
                }
            }
        }

        const dinoBar = document.getElementById('dinoBar');
        if (dinoBar) {
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.attributeName === 'style') {
                        updateSliderHeight();
                    }
                });
            });
            observer.observe(dinoBar, { attributes: true });
        }

        window.addEventListener('load', function() {
            updateSliderHeight();
            const dinoIcon = document.getElementById('dinoIcon');
            if (dinoIcon) {
                dinoIcon.addEventListener('click', function() {
                    setTimeout(updateSliderHeight, 100);
                });
            }
            const closeBtn = document.querySelector('#dinoBar .close-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    setTimeout(updateSliderHeight, 100);
                });
            }
        });

        // ==================== Canvas 1: 星空爱情 ====================
        function drawCanvas1(canvas) {
            H5Scal = ('ontouchstart' in window) ? 0.3 : 1;
            radioY = ('ontouchstart' in window) ? 0.98 : 1
            H5PrintFont = ('ontouchstart' in window) ? 2.3 : 1
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = canvas.parentElement.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);

            // 星空背景
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#0a0a2e');
            bgGrad.addColorStop(0.5, '#1a1a4e');
            bgGrad.addColorStop(1, '#2a1a3e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // 闪烁星星
            if (!canvas._stars) {
                canvas._stars = [];
                for (let i = 0; i < 200; i++) {
                    canvas._stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.7,
                        r: Math.random() * 2 + 0.5,
                        alpha: Math.random(),
                        twinkleSpeed: Math.random() * 0.02 + 0.005,
                        twinkleDir: 1
                    });
                }
            }
            canvas._stars.forEach(star => {
                star.alpha += star.twinkleSpeed * star.twinkleDir;
                if (star.alpha >= 1) star.twinkleDir = -1;
                if (star.alpha <= 0.2) star.twinkleDir = 1;
                ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // 月亮
            ctx.fillStyle = '#fffde7';
            ctx.beginPath();
            ctx.arc(W * 0.8, H * 0.15, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a0a2e';
            ctx.beginPath();
            ctx.arc(W * 0.82, H * 0.13, 55, 0, Math.PI * 2);
            ctx.fill();

            // 地面
            const groundGrad = ctx.createLinearGradient(0, H * 0.92, 0, H * 1);
            groundGrad.addColorStop(0, '#000');
            groundGrad.addColorStop(1, '#000');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, H * 0.92, W, H * 1);

            // 长椅
            const benchX = transPosition(0.3*100,W);
            const benchY = transPositionH(0.9*100,H);
            const bw = 220;
            // 椅背
            ctx.fillStyle = '#4a2c14';
            ctx.fillRect(benchX, benchY - 30, bw, 18);
            ctx.fillRect(benchX, benchY - 36, bw, 8);
            // 椅座
            ctx.fillStyle = '#5d3a1a';
            ctx.fillRect(benchX, benchY - 12, bw, 14);
            // 椅腿
            ctx.fillStyle = '#3e2515';
            ctx.fillRect(benchX + 20, benchY + 2, 14, 30);
            ctx.fillRect(benchX + bw - 34, benchY + 2, 14, 30);
            // 扶手
            ctx.fillStyle = '#4a2c14';
            ctx.fillRect(benchX, benchY - 28, 18, 70);
            ctx.fillRect(benchX + bw - 18, benchY - 28, 18, 70);


            // 长椅
            const benchX2 = transPosition(0.83*100,W);
            const benchY2 = transPositionH(0.92*100,H);
            const bw2 = 220;
            // 椅背
            ctx.fillStyle = '#4a2c14';
            ctx.fillRect(benchX2, benchY2 - 30, bw2, 18);
            ctx.fillRect(benchX2, benchY2 - 36, bw2, 8);
            // 椅座
            ctx.fillStyle = '#5d3a1a';
            ctx.fillRect(benchX2, benchY2 - 12, bw2, 14);
            // 椅腿
            ctx.fillStyle = '#3e2515';
            ctx.fillRect(benchX2 + 20, benchY2 + 2, 14, 30);
            ctx.fillRect(benchX2 + bw2 - 34, benchY2 + 2, 14, 30);
            // 扶手
            ctx.fillStyle = '#4a2c14';
            ctx.fillRect(benchX2, benchY2 - 28, 18, 70);
            ctx.fillRect(benchX2 + bw2 - 18, benchY2 - 28, 18, 70);

            // 情侣剪影（左侧女性，右侧男性）
            const cx = benchX + bw / 2;
            const cy = benchY - 30;
            // 女性
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(cx - 25, cy - 30, 14, 0, Math.PI * 2); // 头
            ctx.fill();
            ctx.fillRect(cx - 35, cy - 16, 20, 30); // 身体
            ctx.fillStyle = '#2a2a4e';
            ctx.beginPath();
            ctx.arc(cx - 25, cy - 50, 18, Math.PI, 0); // 长发
            ctx.fill();
            // 男性
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(cx + 25, cy - 35, 16, 0, Math.PI * 2); // 头
            ctx.fill();
            ctx.fillRect(cx + 15, cy - 19, 22, 34); // 身体
            // 手臂（相拥）
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(cx - 25, cy - 10);
            ctx.quadraticCurveTo(cx, cy - 5, cx + 25, cy - 12);
            ctx.stroke();

            // 土狗
            const dogX = benchX + bw + 40;
            const dogY = benchY + 7;
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.ellipse(dogX, dogY - 10, 22, 14, 0, 0, Math.PI * 2); // 身体
            ctx.fill();
            ctx.beginPath();
            ctx.arc(dogX + 18, dogY - 22, 10, 0, Math.PI * 2); // 头
            ctx.fill();
            ctx.beginPath();
            ctx.arc(dogX + 26, dogY - 26, 4, 0, Math.PI * 2); // 鼻子
            ctx.fill();
            ctx.fillRect(dogX + 5, dogY, 6, 10); // 前腿
            ctx.fillRect(dogX - 12, dogY, 6, 10); // 后腿
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(dogX + 20, dogY - 30, 6, 8); // 耳朵

            // 孩子玩耍
            const childX = W * 0.15;
            const childY = benchY - 5;
            ctx.fillStyle = '#2a1a3e';
            ctx.beginPath();
            ctx.arc(childX, childY - 18, 10, 0, Math.PI * 2); // 头
            ctx.fill();
            ctx.fillRect(childX - 8, childY - 8, 16, 20); // 身体
            ctx.fillRect(childX - 10, childY + 10, 6, 12); // 腿
            ctx.fillRect(childX + 4, childY + 10, 6, 12);

            let radio = 1 * H5Scal;
            let img1W = 942 * radio;
            let img1H = 1032 * radio;
            let img1X = W/2 - img1W/2;
            let img1Y = (H - img1H + 150)*radioY;

            let img2W = 430 * radio;
            let img2H = 430 * radio;
            let img2X = img2W/2 - 100;
            let img2Y = (H - img2H - 40)*radioY;

            let img3W = 180 * radio;
            let img3H = 280 * radio;
            let img3X = W/2 - img3W/2 + (W/2 - img3W/2)/2;
            let img3Y = (H - img3H - 30)*radioY;

            let img4W = 300 * radio;
            let img4H = 340 * radio;
            let img4X = W - img4W + 50;
            let img4Y = (H - img4H + 30)*radioY;

            drawImageSafe('svg/1.svg', img1X, img1Y, img1W, img1H,ctx)
            drawImageSafe('svg/2.svg', img2X, img2Y, img2W, img2H,ctx)
            drawImageSafe('svg/3.svg', img3X, img3Y, img3W, img3H,ctx)
            drawImageSafe('svg/4.svg', img4X, img4Y, img4W, img4H,ctx)

            // "I LOVE LJ" 打字机效果
            const text = "I LOVE LJ,AI LI'On fear！";
            //const text = "while(life){love++;}";

            if (!canvas._textIndex) canvas._textIndex = 0;
            if (!canvas._textTimer) canvas._textTimer = 0;

            canvas._textTimer++;
            if (canvas._textTimer >= 20) {
                canvas._textIndex++;
                canvas._textTimer = 0;
            }
            typewriterDraw(
                ctx,
                text,
                canvas._textIndex,
                W,
                H,
                W * 0.09,
                H * 0.25,
                0.3,
                (i) => {
                    if (i === 0 || i === 1 || i === 2) return transSize(0.3,W);
                    if(i === 12 || i === 13|| i === 14|| i === 15|| i === 16) return transSize(0.3,W);
                    if (i === text.length - 1) return transSize(0.2,W);
                    return transSize(0.164,W);
                },
                (i) => {
                    if (i === 0 || i === 1 || i === 2) return { x: 0, y: transPosition(-1.6,W) };
                    if(i === 12 || i === 13|| i === 14|| i === 15|| i === 16) return { x: 0, y: transPosition(-2.9,W) };
                    if (i === text.length - 1) return { x: 0, y: transPosition(-0.24,W) };
                    return { x: 0, y: 0 };
                }
            );

            if (canvas._textIndex > text.length) {
                canvas._textIndex = 0;
            }

        }
        function transSize(num,W){
            return H5PrintFont * Math.ceil(num * 12) * (W / 100) +'px'
        }
        function transPosition(num,W){
            return H5PrintFont * num * (W / 100)
        }
        function transPositionH(num,H){
            return H5PrintFont * num * (H / 100)
        }
        // 全局缓存对象
        const imageCache = {};

        function drawImageSafe(url, x, y, w, h, ctx) {
            if (imageCache[url]) {
                // 已缓存，直接绘制
                ctx.drawImage(imageCache[url], x, y, w, h);
            } else {
                // 首次加载，缓存起来
                const img = new Image();
                img.crossOrigin = "anonymous";
                if (img.decode) {
                    img.src = url;
                    img.decode().then(() => {
                        imageCache[url] = img;
                        ctx.drawImage(img, x, y, w, h);
                    }).catch(() => {
                        img.onload = () => {
                            imageCache[url] = img;
                            ctx.drawImage(img, x, y, w, h);
                        };
                    });
                } else {
                    img.onload = () => {
                        imageCache[url] = img;
                        ctx.drawImage(img, x, y, w, h);
                    };
                    img.src = url;
                }
            }
        }

        function typewriterDraw(ctx, text, index,W,H,x, y, baseSize, getCharSize, getCharOffset = (i) => ({x:0, y:0}),canvas) {
            if (index <= 0) return;
            const displayText = text.substring(0, index);
            ctx.save();
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#fff';
            let currentX = x;
            let currentY = y
            let mouseHeight = null
            for (let i = 0; i < displayText.length; i++) {
                const char = displayText[i];
                const fontSize = getCharSize(i);
                ctx.font= 'bold '+ fontSize +' Georgia,serif'
                const offset = getCharOffset(i);
                ctx.fillText(char, currentX + offset.x, y + offset.y);
                currentX += ctx.measureText(char).width;
                currentY = y + offset.y;
                // 获取文本的宽度和高度
                const { actualBoundingBoxAscent, actualBoundingBoxDescent } = ctx.measureText(text);
                // 计算文本高度
                mouseHeight = parseInt(actualBoundingBoxAscent) + parseInt(actualBoundingBoxDescent)
            }
            if (index < text.length) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(currentX + 5, currentY,transPosition(baseSize,W),mouseHeight - 7)
            }
            ctx.restore();
        }

        // ==================== Canvas 2-7: 简化版 ====================
        function drawSimpleCanvas(canvas, emoji, label, color1, color2) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.min(canvas.height * 0.3, 150)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(emoji, canvas.width / 2, canvas.height / 2 + Math.min(canvas.height * 0.1, 50));
            ctx.font = `${Math.min(canvas.height * 0.06, 30)}px 'Microsoft YaHei'`;
            ctx.fillText(label, canvas.width / 2, canvas.height * 0.8);
        }

        //function drawCanvas2(c) { drawSimpleCanvas(c, '🏠', '亲情', '#ffa502', '#ff6348'); }
        function drawCanvas2(canvas) {
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = canvas.parentElement.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);

            // ===== 修改这个变量控制整体大小：0.3~0.45 =====
            const SCALE = 0.38;
            // =============================================

            const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
            grad.addColorStop(0, '#2a1a1a');
            grad.addColorStop(0.5, '#2a1a1f');
            grad.addColorStop(1, '#2a1a22');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            if (!canvas._particles) {
                const familySymbols = [
                    '🍳', '🥘', '🍲', '🥟', '🥢', '🥄', '🔪', '🍽️', '🥣', '🍚',
                    '锅', '碗', '瓢', '盆', '筷', '勺', '铲', '灶', '炉', '煲',
                    '米', '油', '盐', '酱', '醋', '茶', '面', '菜', '肉', '汤',
                    '📺', '📻', '📞', '☎️', '🛋️', '💡', '🪑', '📰', '🖼️', '🚪',
                    '电视', '电话', '沙发', '茶几', '台灯', '遥控', '空调', '窗帘',
                    '地毯', '时钟', '花瓶', '相框', '书架', '报纸',
                    '🌸', '🌺', '🌻', '🌹', '🌷', '🌼', '💐', '🥀', '🌾', '🌿',
                    '康乃馨', '玫瑰', '百合', '菊花', '牡丹', '荷花', '梅花', '兰花',
                    '桃花', '杏花', '茉莉', '桂花', '水仙', '杜鹃', '月季',
                    '🏠', '🏡', '👨', '👩', '👧', '👦', '👶', '👴', '👵',
                    '❤️', '💕', '💗', '💖', '💝', '💞', '💓', '🫶',
                    '爸', '妈', '儿', '女', '家', '爱', '暖', '归', '盼', '等'
                ];
                canvas._particles = [];
                for (let i = 0; i < 170; i++) {
                    canvas._particles.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        text: familySymbols[Math.floor(Math.random() * familySymbols.length)],
                        size: Math.random() * 13 + 7,
                        alpha: Math.random(),
                        twinkleSpeed: Math.random() * 0.012 + 0.004,
                        twinkleDir: 1
                    });
                }
            }

            canvas._particles.forEach(p => {
                p.alpha += p.twinkleSpeed * p.twinkleDir;

                p.alpha += p.twinkleSpeed * p.twinkleDir;
                if (p.alpha >= 0.9) p.twinkleDir = -1;
                if (p.alpha <= 0.15) p.twinkleDir = 1;
                ctx.fillStyle = `rgba(100,180,255,${p.alpha})`;
                ctx.font = `${p.size}px 'Courier New', monospace`;
                ctx.fillText(p.symbol, p.x, p.y);
            });

            // 大脑轮廓（由重要符号组成）
            const brainSymbols = ['∑', '∫', 'π', '∞', '√', 'Δ', 'α', 'β', 'θ', 'λ', 'σ', 'Ω', 'f(x)', 'dx'];
            const centerX = W * 0.5;
            const centerY = H * 0.42;
            const brainW = W * 0.55;
            const brainH = H * 0.45;

            if (!canvas._brainPoints) {
                canvas._brainPoints = [];
                // 大脑左半球
                for (let i = 0; i < 35; i++) {
                    const angle = Math.PI * 0.7 + (Math.PI * 1.6 * i / 34);
                    const rx = brainW * 0.48;
                    const ry = brainH * 0.5;
                    canvas._brainPoints.push({
                        x: centerX - brainW * 0.12 + Math.cos(angle) * rx,
                        y: centerY + Math.sin(angle) * ry,
                        symbol: brainSymbols[Math.floor(Math.random() * brainSymbols.length)]
                    });
                }
                // 大脑右半球
                for (let i = 0; i < 35; i++) {
                    const angle = -Math.PI * 0.1 + (Math.PI * 1.6 * i / 34);
                    const rx = brainW * 0.48;
                    const ry = brainH * 0.5;
                    canvas._brainPoints.push({
                        x: centerX + brainW * 0.12 + Math.cos(angle) * rx,
                        y: centerY + Math.sin(angle) * ry,
                        symbol: brainSymbols[Math.floor(Math.random() * brainSymbols.length)]
                    });
                }
                // 胼胝体（中间连接）
                for (let i = 0; i < 8; i++) {
                    canvas._brainPoints.push({
                        x: centerX - 15 + i * 4,
                        y: centerY - 10 + Math.sin(i) * 8,
                        symbol: '='
                    });
                }
                // 脑干
                for (let i = 0; i < 10; i++) {
                    canvas._brainPoints.push({
                        x: centerX - 6 + Math.sin(i * 0.8) * 8,
                        y: centerY + brainH * 0.5 + i * 10,
                        symbol: '|'
                    });
                }
            }

            // 绘制大脑
            canvas._brainPoints.forEach((p, index) => {
                const isCore = index < 12; // 核心符号更亮
                ctx.fillStyle = isCore ? 'rgba(255,220,100,0.95)' : 'rgba(255,200,80,0.8)';
                ctx.font = `bold ${isCore ? 22 : 16}px 'Georgia', serif`;
                ctx.fillText(p.symbol, p.x, p.y);
            });

            // 标题
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.min(H * 0.06, 28)}px 'Microsoft YaHei'`;
            ctx.textAlign = 'center';
            ctx.fillText('r = a(1 - sinθ)', W / 2, H * 0.88);
        }
        // ==================== Canvas 7: 英语 LJ ====================
        function drawCanvas7(canvas) {
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = canvas.parentElement.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);

            // ===== 修改这个变量控制整体大小：0.3~0.45 =====
            const SCALE = 0.38;
            // =============================================

            const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(0.5, '#1a0a35');
            grad.addColorStop(1, '#1a0a3a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            if (!canvas._particles) {
                const allWords = [
                    'a', 'an', 'the', 'is', 'are', 'was', 'were', 'be', 'been', 'have', 'has', 'had',
                    'do', 'does', 'did', 'will', 'would', 'can', 'could', 'shall', 'should', 'may', 'might',
                    'I', 'you', 'he', 'she', 'it', 'we', 'they', 'me', 'him', 'her', 'us', 'them',
                    'my', 'your', 'his', 'its', 'our', 'their', 'this', 'that', 'these', 'those',
                    'who', 'whom', 'whose', 'which', 'what', 'when', 'where', 'why', 'how',
                    'and', 'but', 'or', 'so', 'if', 'because', 'although', 'while', 'since', 'until',
                    'in', 'on', 'at', 'to', 'for', 'from', 'with', 'by', 'about', 'into', 'through',
                    'love', 'hope', 'dream', 'light', 'star', 'moon', 'wind', 'rain', 'fire', 'snow',
                    'hello', 'world', 'good', 'bad', 'big', 'small', 'old', 'new', 'high', 'low',
                    'day', 'night', 'time', 'year', 'life', 'hand', 'eye', 'mind', 'heart', 'soul',
                    'read', 'write', 'speak', 'listen', 'learn', 'teach', 'think', 'know', 'feel', 'grow'
                ];
                canvas._particles = [];
                for (let i = 0; i < 130; i++) {
                    canvas._particles.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        text: allWords[Math.floor(Math.random() * allWords.length)],
                        size: Math.random() * 12 + 8,
                        alpha: Math.random(),
                        twinkleSpeed: Math.random() * 0.015 + 0.005,
                        twinkleDir: 1
                    });
                }
            }

            canvas._particles.forEach(p => {
                p.alpha += p.twinkleSpeed * p.twinkleDir;
                if (p.alpha >= 0.7) p.twinkleDir = -1;
                if (p.alpha <= 0.12) p.twinkleDir = 1;
                ctx.fillStyle = `rgba(180,160,255,${p.alpha * 0.55})`;
                ctx.font = `${p.size}px 'Georgia', serif`;
                ctx.fillText(p.text, p.x, p.y);
            });

            const size = Math.min(W, H) * SCALE;
            const cx = W * 0.5;
            const cy = H * 0.42;
            const letterH = size * 0.75;
            const letterW = size * 0.55;
            const gap = size * 0.15;

            if (!canvas._ljPoints) {
                canvas._ljPoints = [];
                const ljWords = ['Love', 'Joy', 'Life', 'Laugh', 'Learn', 'Light', 'Luck', 'Loyal', 'Justice', 'Journey', 'Jazz', 'Jump', 'Join', 'Joke', 'Jewel', 'Lemon', 'Lake', 'Lion', 'Lily', 'Lotus'];

                // ===== L =====
                const lx = cx - letterW * 0.65;
                const ly = cy - letterH / 2;
                // 竖线
                for (let i = 0; i < 10; i++) {
                    canvas._ljPoints.push({
                        x: lx - letterW * 0.38,
                        y: ly + i * letterH / 9,
                        text: ljWords[i % ljWords.length]
                    });
                }
                // 横线——只放3个单词，首尾各一个，中间一个
                canvas._ljPoints.push({ x: lx - letterW * 0.38, y: ly + letterH, text: ljWords[5] });
                canvas._ljPoints.push({ x: lx + letterW * 0.07, y: ly + letterH, text: ljWords[6] });
                canvas._ljPoints.push({ x: lx + letterW * 0.5, y: ly + letterH, text: ljWords[7] });

                // ===== J =====
                const jx = cx + letterW * 0.65;
                const jy = ly;
                // 顶部横线——只放3个单词
                canvas._ljPoints.push({ x: jx - letterW * 0.35, y: jy, text: ljWords[10] });
                canvas._ljPoints.push({ x: jx + letterW * 0.05, y: jy, text: ljWords[11] });
                canvas._ljPoints.push({ x: jx + letterW * 0.45, y: jy, text: ljWords[12] });
                // 竖线
                for (let i = 0; i < 8; i++) {
                    canvas._ljPoints.push({
                        x: jx + letterW * 0.3,
                        y: jy + i * letterH * 0.7 / 7,
                        text: ljWords[i % ljWords.length]
                    });
                }
                // 底部弯钩——只放3个单词
                for (let i = 0; i < 3; i++) {
                    const angle = Math.PI * 0.05 + Math.PI * 0.85 * i / 2;
                    canvas._ljPoints.push({
                        x: jx + letterW * 0.24 + Math.cos(angle) * letterW * 0.3,
                        y: jy + letterH * 0.7 + Math.sin(angle) * letterH * 0.24,
                        text: ljWords[(i + 15) % ljWords.length]
                    });
                }
            }

            canvas._ljPoints.forEach((p, index) => {
                const isL = index < 13;
                const isCore = (isL && index < 6) || (!isL && index >= 13 && index < 17);
                ctx.fillStyle = isL
                    ? (isCore ? 'rgba(255,200,80,0.95)' : 'rgba(255,170,60,0.6)')
                    : (isCore ? 'rgba(100,220,255,0.9)' : 'rgba(80,200,240,0.55)');
                ctx.font = `bold ${isCore ? 16 : 13}px 'Georgia', serif`;
                ctx.textAlign = 'center';
                ctx.fillText(p.text, p.x, p.y);
            });

            ctx.fillStyle = 'rgba(200,180,255,0.8)';
            ctx.font = `${Math.min(H * 0.035, 18)}px 'Microsoft YaHei'`;
            ctx.textAlign = 'center';
            ctx.fillText('You are my everything', W / 2, H * 0.78);

            ctx.fillStyle = '#d0c8f0';
            ctx.font = `${Math.min(H * 0.06, 28)}px 'Microsoft YaHei'`;
            ctx.fillText('You are my everything', W / 2, H * 0.9);
        }

        // ==================== 初始化和动画循环 ====================
        function animate() {
            const activeCanvas = document.querySelector('.slide.active canvas');
            const canvas1 = document.getElementById('canvas1')
            if(!activeCanvas){
                return
            }
            if (activeCanvas.id === 'canvas1') {
                drawCanvas1(activeCanvas);
            }else{
                canvas1._textIndex = 0
                canvas1._textTimer = 0
            }
            requestAnimationFrame(animate);
        }
        animate();

        function initMath(){
            canvas6Event.addEventListener('click', () => {
                const link = document.createElement('a');
                link.href = './nestedInvolutionRingHuge.html';
                link.target = '_self';
                link.rel = 'noopener noreferrer';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
        function initCanvas() {
                drawCanvas2(document.getElementById('canvas2'));
                drawCanvas3(document.getElementById('canvas3'));
                drawCanvas4(document.getElementById('canvas4'));
                drawCanvas5(document.getElementById('canvas5'));
                drawCanvas6(document.getElementById('canvas6'));
                drawCanvas7(document.getElementById('canvas7'));
                initMath()
        }
        initCanvas();

        window.addEventListener('resize', initCanvas);
    </script>
