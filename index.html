<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    #globalLoading {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
    }
    .gl-spinner {
            width: 80px;
            height: 80px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #7cb8b8;
            border-radius: 50%;
            animation: gl-spin 0.8s linear infinite;
    }
    @keyframes gl-spin {
            to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // ============================================================
    // initPageMeta
    // ============================================================
    async function initPageMeta() {
        window.PAGE_META.title = "首页";
        window.PAGE_META.cssFront = ["./css/index.css"];
        window.PAGE_META.jsEnd = [
            "./compressed/index.js.txt",
            "../compressed/play-audio.js.txt"
        ];
        window.PAGE_META.metaLoader = [
            "../compressed/meta-loader.js.txt"
        ];
    }

    // ============================================================
    // initPageContent
    // ============================================================
    async function initPageContent() {
        window.PAGE_META.content =
        `
        <div id="globalLoading">
            <div class="gl-spinner"></div>
        </div>   <!-- 一进页面就有 -->
        <div id="topBarContainer"></div>
        <div id="slider">
        <div class="slide active"><canvas id="canvas1"></canvas></div>
        <div class="slide"><canvas id="canvas2"></canvas></div>
        <div class="slide"><canvas id="canvas3"></canvas></div>
        <div class="slide"><canvas id="canvas4"></canvas></div>
        <div class="slide"><canvas id="canvas5"></canvas></div>
        <div class="slide" onclick="canvasClickFun()"><canvas id="canvas6"></canvas></div>
        <div class="slide"><canvas id="canvas7"></canvas></div>
        <div class="slide"><canvas id="canvas8"></canvas></div>
        <div class="slide" onclick="canvasClickFun()"><canvas id="canvas9"></canvas></div>
        <button class="arrow left" onclick="prevSlide()">❮</button>
        <button class="arrow right" onclick="nextSlide()">❯</button>
        <div id="dots">
            <span class="active" onclick="goTo(0)"></span><span onclick="goTo(1)"></span><span onclick="goTo(2)"></span><span onclick="goTo(3)"></span><span onclick="goTo(4)"></span><span onclick="goTo(5)"></span><span onclick="goTo(6)"></span><span onclick="goTo(7)"></span><span onclick="goTo(8)"></span>
        </div>
    </div>
        `;
    }
  </script>
  <script src="./js/loader.js"></script>
</head>
<body>
</body>
</html>
