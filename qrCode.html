<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="./js/meta-config.js"></script>
  <script>
    window.PAGE_META.title = "纯手写二维码生成器"
    window.PAGE_META.cssFront = ["./css/qrCode.css"]
    window.PAGE_META.jsEnd = ["./js/qrCodePage.js"]
  </script>
  </style>
  <script>
    window.PAGE_META.content =
    `
    <div class="container">
        <h1>🔳 纯手写二维码生成器</h1>
        <p class="subtitle">标准QR码 · 手机可扫 · 去掉定位点 · 中间加Logo</p>
        <div style="text-align: center; margin-bottom: 1rem;">
            <span class="feature-tag tag-green">🗑️ 去掉三个定位点</span>
            <span class="feature-tag tag-blue">🎯 中间加Logo</span>
            <span class="feature-tag tag-orange">🛡️ H级容错 30%</span>
        </div>
        <div class="card">
            <div class="section-title">📝 二维码内容</div>
            <input id="qrText" value="https://www.baidu.com" placeholder="输入文字或链接">
            <div class="flex-row" style="margin-top: 0.8rem;">
                <div><label>📐 模块大小</label><input type="number" id="moduleSize" value="8" min="4" max="20"></div>
                <div><label>🛡️ 容错率</label><select id="ecLevel"><option value="L">低 (~7%)</option><option value="M">中 (~15%)</option><option value="Q">较高 (~25%)</option><option value="H" selected>高 (30%)</option></select></div>
            </div>
            <div class="flex-row" style="margin-top: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0;"><input type="checkbox" id="removeFinders"><label for="removeFinders" style="margin:0; cursor:pointer; font-size: 0.85rem;">🗑️ 去掉三个定位点</label></div>
                <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0;"><input type="checkbox" id="addLogo" checked><label for="addLogo" style="margin:0; cursor:pointer; font-size: 0.85rem;">🎯 中间加Logo</label></div>
            </div>
            <div id="logoSection" style="margin-top: 0.8rem;">
                <div class="section-title">🎯 Logo 设置</div>
                <div class="flex-row">
                    <div><label>📁 Logo图片</label><input type="file" id="logoInput" accept="image/*" style="display:none;"><button class="btn-upload" onclick="document.getElementById('logoInput').click()" style="margin-bottom: 0;">📁 选择图片</button></div>
                    <div><label>或 Emoji</label><input id="logoEmoji" value="🌹" placeholder="emoji" style="text-align:center; font-size:1.2rem; margin-bottom: 0;"></div>
                </div>
                <div class="logo-preview" id="logoPreview">🌹</div>
            </div>
            <button class="btn-gen" id="genBtn" style="margin-top: 1rem;">✨ 生成二维码</button>
        </div>
        <div class="flex-row">
            <div class="card" style="text-align:center; flex: 1;"><div class="section-title">📱 二维码预览</div><div class="qr-box"><div id="qrDisplay">等待生成...</div></div><button class="btn-download" id="downloadBtn" style="margin-top: 0.8rem; display:none;">💾 下载二维码</button></div>
            <div class="card" style="flex: 1.5;"><div class="section-title">🔍 解析日志</div><div class="result" id="resultDisplay">等待生成...</div><div class="log-box" id="logBox"></div></div>
        </div>
    </div>
    `
  </script>
  <script src="./js/meta-loader.js"></script>
</head>
<body>
</body>
</html>
