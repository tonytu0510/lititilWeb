<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="./js/meta-config.js"></script>
  <script>
    window.PAGE_META.title = "英文拆解 · 0与1"
    window.PAGE_META.cssFront = ["./css/english-01.css"]
  </script>
  </style>
  <script>
    window.PAGE_META.content =
    `
    <div class="wrap">
        <header>
            <h1>英文拆解</h1>
            <p>英文字母不是字母，是 0 和 1 的加减法。</p>
        </header>

        <div class="section">
            <h2>基础规则</h2>
            <div class="explain">
                <p><span class="highlight">o = 0</span></p>
                <p><span class="highlight">丨 = 1</span></p>
                <p><span class="highlight">半0 = 0的一半</span></p>
                <p>两个半0，可以合成一个0，也可以约掉。</p>
            </div>
        </div>

        <div class="section">
            <h2>字母拆法</h2>
            <table>
                <thead>
                    <tr>
                        <th>字母</th>
                        <th>拆法</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>d</td><td>半0 + 1</td></tr>
                    <tr><td>b</td><td>1 + 半0</td></tr>
                    <tr><td>p</td><td>半0 + 1</td></tr>
                    <tr><td>q</td><td>半0 + 1</td></tr>
                    <tr><td>n</td><td>半0</td></tr>
                    <tr><td>u</td><td>半0</td></tr>
                    <tr><td>c</td><td>半0</td></tr>
                    <tr><td>o</td><td>0</td></tr>
                    <tr><td>l</td><td>1</td></tr>
                    <tr><td>i</td><td>1</td></tr>
                    <tr><td>t</td><td>1 + 0</td></tr>
                    <tr><td>f</td><td>1 + 0</td></tr>
                    <tr><td>e</td><td>1 + 0</td></tr>
                    <tr><td>a</td><td>1 + 半0</td></tr>
                    <tr><td>g</td><td>0 + 1</td></tr>
                    <tr><td>y</td><td>1 + 1</td></tr>
                    <tr><td>v</td><td>1 + 1</td></tr>
                    <tr><td>w</td><td>1 + 1 + 1</td></tr>
                    <tr><td>m</td><td>半0 + 半0 + 半0</td></tr>
                    <tr><td>h</td><td>1 + 半0 + 1</td></tr>
                    <tr><td>k</td><td>1 + 1</td></tr>
                    <tr><td>x</td><td>1 + 1</td></tr>
                    <tr><td>r</td><td>1 + 半0</td></tr>
                    <tr><td>s</td><td>0弯一下</td></tr>
                    <tr><td>z</td><td>1 + 0 + 1</td></tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>单词试算</h2>
            <div class="explain">
                <p><span class="highlight">no</span></p>
                <p>n + o = 半0 + 0 = 0 + 0 = 0</p>
            </div>
            <div class="explain">
                <p><span class="highlight">on</span></p>
                <p>o + n = 0 + 半0 = 0</p>
            </div>
            <div class="explain">
                <p><span class="highlight">do</span></p>
                <p>d + o = 半0 + 1 + 0 = 1 + 0 + 0 = 1</p>
            </div>
            <div class="explain">
                <p><span class="highlight">be</span></p>
                <p>b + e = 1 + 半0 + 1 + 0 = 1 + 1 + 0 + 0 = 2</p>
            </div>
            <div class="explain">
                <p><span class="highlight">love</span></p>
                <p>l + o + v + e = 1 + 0 + (1+1) + (1+0)</p>
                <p>= 1 + 0 + 1 + 1 + 1 + 0 = 4</p>
            </div>
            <p class="note">每个词，都能用 0 和 1 算出一个值。</p>
        </div>

        <div class="section">
            <h2>一句话总结</h2>
            <div class="explain">
                <p>英文字母不是拼音，是结构。</p>
                <p>d、b、p、q 是半0加1，n、u、c是半0，o是0，l是1。</p>
                <p>它们可以加，可以约，可以变成数字。</p>
                <p>英文和中文一样，都在 0 和 1 之间。</p>
            </div>
        </div>

        <footer>
            字母不是字母，是 0 和 1 在排队。
        </footer>
    </div>
    `
  </script>
  <script src="./js/meta-loader.js"></script>
</head>
<body>
</body>
</html>
