<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
    // ============================================================
    // initPageMeta
    // ============================================================
    async function initPageMeta() {
        window.PAGE_META.title = "中国时区钟 - RSTUV"
        window.PAGE_META.cssFront = ["./css/chinaClock.css"]
        window.PAGE_META.jsEnd = ["../compressed/chinaClock.js.txt"]

        window.PAGE_META.metaLoader = [
            "../compressed/meta-loader.js.txt"
        ];
    }

    // ============================================================
    // initPageContent
    // ============================================================
    async function initPageContent() {
        window.PAGE_META.content =
        `
        <div id="topBarContainer"></div>
        <div class="clock-container-wrap">
        <div class="clock-container">
            <canvas id="clock" width="350" height="350"></canvas>
            <div class="info">
                当前显示：<span id="displayZone">东八区 (U) 北京时间</span>
            </div>
            <div class="beijing-info">
                北京时间：<span id="beijingTime">--</span>
            </div>
            <div class="zones" id="zoneList"></div>
        </div>
    </div>
        `;
    }
  </script>
</head>
<body>
</body>
<script src="./js/loader.js"></script>
</html>
