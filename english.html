    <h2>一、单词结构</h2>
    <div class="box">
      <code>前缀 + 词根 + 后缀</code>
      <ul>
        <li><b>前缀</b>：管方向、位置</li>
        <li><b>词根</b>：管核心意思</li>
        <li><b>后缀</b>：管词性 / 人 / 事 / 物</li>
      </ul>
    </div>

    <h2>二、三层各自规则</h2>
    <p>同源归并 + 一个大白话意思 + 一个只干一件事</p>
    <ul>
      <li>一个词根只能有一个意思</li>
      <li>意思必须是大白话</li>
      <li>罩不住 = 拆错了，不是词根错了</li>
    </ul>

    <h2>三、双写规则（核心）</h2>
    <p>前缀尾字母 <b>撞上</b> 词根首字母：</p>
    <ul>
      <li><b>撞上（双写）→ 双人</b></li>
      <li><b>不撞（不双）→ 单人</b></li>
    </ul>
    <table>
      <tr><th>单词</th><th>拆法</th><th>接壤</th><th>人</th></tr>
      <tr><td>success</td><td>suc + cess</td><td>cc</td><td>双人</td></tr>
      <tr><td>access</td><td>ac + cess</td><td>cc</td><td>双人</td></tr>

      <tr><td>receive</td><td>re + ceive</td><td>ec</td><td>单人</td></tr>
    </table>

    <h2>四、意思怎么定</h2>
    <ul>
      <li>单词意思绝对不改</li>
      <li>罩不住时，改的是前缀 / 词根的意思，不是单词</li>
      <li>改到能一句话罩住全部为止</li>
    </ul>
