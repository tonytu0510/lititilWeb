<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圆弧菜单 · 圆心右下</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            overflow: hidden;
        }

        #menuTrigger {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #2a2a2a;
            border-radius: 50%;
            border: 1px solid #3d3d3d;
            color: #d0d0d0;
            font-size: 28px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            user-select: none;
        }
        #menuTrigger:hover {
            background: #3d3d3d;
        }
        #menuTrigger.active {
            background: #7cb8b8;
            color: #0d0d0d;
        }

        #menuContainer {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 400px;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        #menuContainer.active {
            pointer-events: auto;
        }

        #menuBg {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        #menuContainer.active #menuBg {
            opacity: 1;
        }

        .menu-item {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            color: #999;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            opacity: 0;
            user-select: none;
            font-family: 'Courier New', monospace;
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 0.5px;
            will-change: right, bottom, opacity;
            margin-left: -22px;
            margin-top: -22px;
        }
        .menu-item.active {
            background: #7cb8b8;
            color: #0d0d0d;
            border-color: #7cb8b8;
        }
        #menuContainer.active .menu-item {
            pointer-events: auto;
            opacity: 1;
        }

        #currentLabel {
            position: fixed;
            bottom: 100px;
            right: 30px;
            color: #444;
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 1001;
            pointer-events: none;
            text-align: right;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.4s;
        }
        #currentLabel.show {
            opacity: 1;
        }
        #currentLabel .name {
            color: #7cb8b8;
            font-size: 16px;
        }
        #currentLabel .index {
            color: #555;
            font-size: 11px;
        }

        #pageContent {
            color: #444;
            font-size: 14px;
            padding: 40px;
            text-align: center;
            margin-top: 20vh;
            letter-spacing: 1px;
            line-height: 2;
        }
        #pageContent span {
            color: #7cb8b8;
        }

        @media (max-width: 500px) {
            #menuContainer {
                width: 300px;
                height: 300px;
            }
            .menu-item {
                width: 36px;
                height: 36px;
                font-size: 10px;
                margin-left: -18px;
                margin-top: -18px;
            }
            #menuTrigger {
                width: 50px;
                height: 50px;
                font-size: 22px;
                bottom: 20px;
                right: 20px;
            }
            #currentLabel {
                bottom: 80px;
                right: 20px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div id="pageContent">
        <span>⬡ 圆弧菜单</span><br>
        圆心右下 · 选中项居中可见
    </div>

    <div id="currentLabel">
        <div class="index" id="currentIndex">1 / 14</div>
        <div class="name" id="currentName">首页</div>
        <div style="color:#555;font-size:11px;">滚轮/滑动切换</div>
    </div>

    <button id="menuTrigger">☰</button>

    <div id="menuContainer">
        <div id="menuBg"></div>
    </div>

    <script>
        (function() {
            const menuData = [
                { name: '首页', href: 'index.html?M=1' },
                { name: '工具箱', href: 'tools.html' },
                { name: '二维码', href: 'qrCode.html' },
                { name: '对合环', href: 'nestedInvolutionRingHuge.html' },
                { name: 'RSTUV', href: 'chinaClock.html' },
                { name: '太阳系', href: 'cosmos.html' },
                { name: '拆字', href: 'fontAll.html' },
                { name: '缘分测试', href: 'namePairing.html' },
                { name: '判证', href: 'panding.html' },
                { name: '130演示', href: '130demo.html' },
                { name: '笔记', href: 'notes.html' },
                { name: '布线笔记', href: 'cable.html' },
                { name: '关于我', href: 'aboutMe.html' },
                { name: '声明', href: 'statement.html' }
            ];

            const container = document.getElementById('menuContainer');
            const trigger = document.getElementById('menuTrigger');
            const currentName = document.getElementById('currentName');
            const currentIndex = document.getElementById('currentIndex');
            const label = document.getElementById('currentLabel');

            let isOpen = false;
            let selectedIndex = 0;
            let isDragging = false;
            let rotationOffset = 0;

            // ===== 构建菜单 =====
            function buildMenu() {
                const count = menuData.length;
                const size = container.offsetWidth || 400;
                const radius = size * 0.55;

                container.querySelectorAll('.menu-item').forEach(el => el.remove());

                menuData.forEach((item, index) => {
                    const el = document.createElement('a');
                    el.className = 'menu-item';
                    el.textContent = item.name.length > 4 ? item.name.slice(0, 4) : item.name;
                    el.title = item.name;
                    el.href = item.href;
                    el.dataset.index = index;

                    const baseAngle = -90 + (360 * index / count);
                    el.dataset.baseAngle = baseAngle;

                    el.addEventListener('click', function(e) {
                        e.preventDefault();
                        const idx = parseInt(this.dataset.index);
                        selectItem(idx);
                        toggleMenu(false);
                        setTimeout(() => {
                            window.location.href = this.href;
                        }, 300);
                    });

                    container.appendChild(el);
                });

                updatePositions(0);
                selectItem(0);
            }

            // ===== 更新所有菜单项位置 =====
            function updatePositions(offsetDeg) {
                const count = menuData.length;
                const size = container.offsetWidth || 400;
                const radius = size * 0.55;
                const items = container.querySelectorAll('.menu-item');

                items.forEach((el, index) => {
                    const baseAngle = parseFloat(el.dataset.baseAngle);
                    const angleDeg = baseAngle + offsetDeg;
                    const rad = angleDeg * Math.PI / 180;
                    const x = radius * Math.cos(rad);
                    const y = radius * Math.sin(rad);

                    el.style.right = (x - 22) + 'px';
                    el.style.bottom = (y - 22) + 'px';
                });
            }

            // ===== 选择高亮 =====
            function selectItem(index) {
                const items = container.querySelectorAll('.menu-item');
                items.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });
                selectedIndex = index;
                if (menuData[index]) {
                    currentName.textContent = menuData[index].name;
                    currentIndex.textContent = (index + 1) + ' / ' + menuData.length;
                }
                label.classList.add('show');
            }

            // ===== 切换到指定索引，并旋转使其居中 =====
            function switchToIndex(index) {
                const count = menuData.length;
                const targetAngle = 45;
                const baseAngle = -90 + (360 * index / count);
                const offset = targetAngle - baseAngle;
                rotationOffset = offset;
                updatePositions(offset);
                selectItem(index);
            }

            // ===== 滚轮/滑动增量切换 =====
            function stepSwitch(delta) {
                const count = menuData.length;
                // 修复方向：delta > 0 向下滚 → 下一项
                const dir = delta > 0 ? 1 : -1;
                const next = (selectedIndex + dir + count) % count;
                switchToIndex(next);
            }

            // ===== 切换菜单开关 =====
            function toggleMenu(open) {
                isOpen = open;
                container.classList.toggle('active', open);
                trigger.classList.toggle('active', open);
                if (!open) {
                    setTimeout(() => {
                        if (!isOpen) label.classList.remove('show');
                    }, 300);
                } else {
                    label.classList.add('show');
                    setTimeout(() => {
                        switchToIndex(selectedIndex);
                    }, 50);
                }
            }

            // ===== 事件绑定 =====
            trigger.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMenu(!isOpen);
            });

            document.addEventListener('click', function(e) {
                if (isOpen && !container.contains(e.target) && e.target !== trigger) {
                    toggleMenu(false);
                }
            });

            // 鼠标滚轮
            document.addEventListener('wheel', function(e) {
                if (!isOpen) return;
                e.preventDefault();
                stepSwitch(e.deltaY);
            }, { passive: false });

            // 鼠标拖拽
            let dragStartY = 0;
            container.addEventListener('mousedown', function(e) {
                if (!isOpen) return;
                isDragging = true;
                dragStartY = e.clientY;
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging || !isOpen) return;
                const dy = e.clientY - dragStartY;
                if (Math.abs(dy) > 15) {
                    stepSwitch(dy);
                    dragStartY = e.clientY;
                }
            });

            document.addEventListener('mouseup', function() {
                isDragging = false;
            });

            // 触摸滑动
            let touchStartY = 0;
            container.addEventListener('touchstart', function(e) {
                if (!isOpen) return;
                isDragging = true;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            container.addEventListener('touchmove', function(e) {
                if (!isDragging || !isOpen) return;
                const dy = e.touches[0].clientY - touchStartY;
                if (Math.abs(dy) > 20) {
                    stepSwitch(dy);
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });

            container.addEventListener('touchend', function() {
                isDragging = false;
            }, { passive: true });

            // 键盘支持
            document.addEventListener('keydown', function(e) {
                if (!isOpen) return;
                if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    stepSwitch(-1);
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    stepSwitch(1);
                } else if (e.key === 'Escape') {
                    toggleMenu(false);
                } else if (e.key === 'Enter') {
                    const items = container.querySelectorAll('.menu-item');
                    if (items[selectedIndex]) {
                        items[selectedIndex].click();
                    }
                }
            });

            // ===== 初始化 =====
            function init() {
                buildMenu();
                toggleMenu(false);
            }

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(init, 300);
            });

            init();
        })();
    </script>
</body>
</html>
