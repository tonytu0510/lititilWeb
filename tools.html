<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="./js/meta-config.js"></script>
  <script>
    window.PAGE_META.title = "工具"
    window.PAGE_META.cssFront = ["./css/tools.css"]
    window.PAGE_META.jsEnd = ["./js/tools.js"]
  </script>
  </style>
  <script>
    window.PAGE_META.content =
    `
    <div class="container">
        <h1>🛠️ 工具箱</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('crypto')">🔐 加密解密</button>
            <button class="tab" onclick="switchTab('compress')">📦 压缩工具</button>
            <button class="tab" onclick="switchTab('format')">📝 文本格式化</button>
        </div>

        <!-- 加密解密 -->
        <div id="crypto" class="tab-content active">
            <h3>汉字加密解密</h3>
            <textarea id="cryptoInput" placeholder="输入汉字，如：无锡"></textarea>
            <button onclick="crypto('encrypt')">🔒 加密</button>
            <button onclick="crypto('decrypt')">🔓 解密</button>
            <div class="result" id="cryptoResult"></div>
        </div>

        <!-- 压缩工具 -->
        <div id="compress" class="tab-content">
            <h3>字母/汉字压缩</h3>
            <textarea id="compressInput" placeholder="输入文本，如：Zhaotong 或 无锡"></textarea>
            <button onclick="compress('letters')">🔤 字母压缩</button>
            <button onclick="compress('chinese')">🀄 汉字压缩</button>
            <div class="result" id="compressResult"></div>
        </div>

        <!-- 文本格式化 -->
        <div id="format" class="tab-content">
            <h3>大小写转换 / 驼峰命名</h3>
            <textarea id="formatInput" placeholder="输入文本"></textarea>
            <button onclick="formatText('upper')">全大写</button>
            <button onclick="formatText('lower')">全小写</button>
            <button onclick="formatText('camel')">大驼峰</button>
            <button onclick="formatText('pascal')">小驼峰</button>
            <button onclick="formatText('reverse')">反转大小写</button>
            <div class="result" id="formatResult"></div>
        </div>
    </div>
    `
  </script>
  <script src="./js/meta-loader.js"></script>
</head>
<body>
</body>
</html>
