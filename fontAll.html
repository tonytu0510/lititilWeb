        <div id="tab1" class="tab-panel active">
            <div class="entry">
                <span class="char">占</span>
                <span class="def"><strong>卜（戈尖倒刺）+ 口（宣说）</strong> → 用口传达卜兆，掌控天意。</span>
                <span class="quote">“竖着是占”</span>
            </div>
            <div class="entry">
                <span class="char">石</span>
                <span class="def"><strong>卜（突出在下）+ 大地</strong> → 戈尖扎进土石，成为地基。</span>
                <span class="quote">“在下是石”</span>
            </div>
            <div class="entry">
                <span class="char">卜</span>
                <span class="def"><strong>兵戈上的突出</strong> → 可指天（卜），可扎地（石），方位即命运。</span>
                <span class="quote">“兵戈上一个突出”</span>
            </div>
            <div class="entry">
                <span class="char">我</span>
                <span class="def"><strong>生戈破天</strong> → 戈从地起斜刺捅穿天幕，天崩碎为丿丶。</span>
                <span class="quote">“我 就是生兵戈把天捅破了”</span>
            </div>
            <div class="entry">
                <span class="char">伐</span>
                <span class="def"><strong>人 + 戈</strong> → 戈刃架颈，斩首之象；天子没头，仍持戈而战。</span>

            </div>
        </div>

                <span class="quote">“成就是一万人的一半 5000人拿着戈”</span>
            </div>
            <div class="entry">
                <span class="char">國</span>
                <span class="def"><strong>戈 + 石（粮）</strong> → 城墙之内，戈护粮仓，立国之本。</span>
                <span class="quote">“繁体字的国就是兵戈加石 粮食”</span>
            </div>
            <div class="entry">
                <span class="char">卦</span>

            </div>
            <div class="entry">

        </div>
