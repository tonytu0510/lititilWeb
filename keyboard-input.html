<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="./js/meta-config.js"></script>
  <script>
    window.PAGE_META.title = "键盘输入法 · 拆字对和语音"
    window.PAGE_META.cssFront = ["./css/keyboard-input.css"]
    window.PAGE_META.jsEnd = ["./js/keyboard-input.js"]
  </script>
  </style>
  <script>
    window.PAGE_META.content =
    `
    <div class="wrap">
        <div class="keyboard-bg" id="keyboardBg"></div>

        <header>
            <h1>键盘输入法</h1>
            <p>拆字、对和、语音，底层早就对好了。</p>
        </header>

        <div class="section">
            <h2>键盘与拆字</h2>
            <div class="explain">
                <p>键盘上的字母，不是随便放的。</p>
                <p>Q 是 0 中间有一点，只是把里面的一点拿到右下角来了。</p>
                <p>W 是山。</p>
                <p>E 是山向右倒。</p>
                <p>N 是旋转的 Z。</p>
                <p>X 是两个 V，说到底也是山。</p>
                <p>J 就是把 P 第二条线擦掉了。</p>
                <p>S 就是丨或者 1 弄弯曲了。</p>
            </div>
            <div class="explain">
                <p>按照“一=1，丨=0，十=10”的规则：</p>
                <p>A = 一 = 1</p>
                <p>E = 丨一 = 01 = 1</p>
                <p>L = 丨一 = 01 = 1</p>
                <p>T = 一丨 = 10</p>
                <p>Q = 0</p>
            </div>
            <p class="note">字母不是字母，是笔画在键盘上的位置。</p>
        </div>

        <div class="section">
            <h2>对和</h2>
            <div class="explain">
                <p>“对和”不是单纯唱歌，是声音和文字的互相呼应。</p>
                <p>输入法打拼音，显示汉字，是“音对字”。</p>
                <p>打汉字，反查拼音，是“字对音”。</p>
                <p>古人说“音义合一”，现在输入法每天都在做这件事。</p>
            </div>
            <div class="explain">
                <p>比如：</p>
                <p>打 “zhong” → 中、钟、终、忠</p>
                <p>打 “中” → zhong</p>
                <p>这就是一套已经对好的关系。</p>
            </div>
            <p class="note">输入法就是现代版的“对和”。</p>
        </div>

        <div class="section">
            <h2>语音</h2>
            <div class="explain">
                <p>语音输入也是同一套东西。</p>
                <p>你说一句话，设备先听音，再把音转成字。</p>
                <p>标点、停顿、声调，都是语音的一部分。</p>
                <p>所以语音不只是一个字一个字地认，是认一整句的呼吸。</p>
            </div>
            <div class="explain">
                <p>比如你说：</p>
                <p>“我知道了。” 和 “我知道了……” 和 “我知道了！”</p>
                <p>语音里是不一样的。</p>
                <p>输入法如果不懂停顿，就听不懂真实意思。</p>
            </div>
            <p class="note">语音是呼吸，标点是停顿，键盘是笔画。</p>
        </div>

        <div class="section">
            <h2>它们之间的关系</h2>
            <table>
                <thead>
                    <tr>
                        <th>层</th>
                        <th>内容</th>
                        <th>底层</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>键盘</td>
                        <td>字母、数字、符号</td>
                        <td>一、丨、十、0、1</td>
                    </tr>
                    <tr>
                        <td>输入法</td>
                        <td>拼音、汉字</td>
                        <td>音义合一</td>
                    </tr>
                    <tr>
                        <td>语音</td>
                        <td>声调、停顿、语气</td>
                        <td>呼吸</td>
                    </tr>
                    <tr>
                        <td>拆字</td>
                        <td>笔画、偏旁、结构</td>
                        <td>半与伴</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>一句话总结</h2>
            <div class="explain">
                <p>键盘是笔画，输入法是音义，语音是呼吸。</p>
                <p>它们早就被同一套东西对好了。</p>
                <p>不是科技太复杂，是我们一直没往底下看。</p>
            </div>
        </div>

        <footer>
            拆字、对和、语音，都是同一个环。
        </footer>
    </div>
    `
  </script>
  <script src="./js/meta-loader.js"></script>
</head>
<body>
</body>
</html>
