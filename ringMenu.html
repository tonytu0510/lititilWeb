<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shanna.Li">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="个人网站,弘扬正能量">
    <meta name="description" content="这是一个个人网站,弘扬正能量">
    <meta name="registration" content="网站备案号：苏ICP备2026047321号-1,公安备案号：苏公网安备32020602003916号">
    <title>环形多级 · 移动端适配</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./common.css">
    <script src="./dino-game.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            overflow: hidden;
        }

        #menuTrigger {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #2a2a2a;
            border-radius: 50%;
            border: 1px solid #3d3d3d;
            color: #d0d0d0;
            font-size: 28px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            user-select: none;
        }
        #menuTrigger:hover { background: #3d3d3d; }
        #menuTrigger.active { background: #7cb8b8; color: #0d0d0d; }

        #menuContainer {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 480px;
            height: 480px;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
            display: none;
        }
        #menuContainer.active {
            pointer-events: auto;
            display: block;
        }

        #menuBg {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(24,24,24,0.92);
            backdrop-filter: blur(6px);
            border-left: 1px solid #2a2a2a;
            border-top: 1px solid #2a2a2a;
            opacity: 0;
            transition: opacity 0.35s ease;
            border-radius: 480px 0 0 0;
        }
        #menuContainer.active #menuBg { opacity: 1; }

        .layer-wrapper {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .menu-item {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid #3d3d3d;
            color: #999;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            font-family: 'Courier New', monospace;
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            margin-left: -22px;
            margin-top: -22px;
            z-index: 10;
            pointer-events: auto;
        }
        .menu-item:hover {
            border-color: #7cb8b8;
            color: #d0d0d0;
            transform: scale(1.08);
        }
        .menu-item.active {
            background: #7cb8b8;
            color: #0d0d0d;
            border-color: #7cb8b8;
            box-shadow: 0 0 40px rgba(124,184,184,0.3);
        }
        .menu-item.sub {
            width: 36px; height: 36px; font-size: 10px;
            margin-left: -18px; margin-top: -18px;
            z-index: 5;
        }
        .menu-item.sub2 {
            width: 32px; height: 32px; font-size: 9px;
            margin-left: -16px; margin-top: -16px;
            z-index: 4;
        }
        .menu-item.sub3 {
            width: 28px; height: 28px; font-size: 8px;
            margin-left: -14px; margin-top: -14px;
            z-index: 3;
        }

        .slide-arrow {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(26,26,26,0.8);
            border: 1px solid #3d3d3d;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 20;
            backdrop-filter: blur(4px);
            user-select: none;
            pointer-events: auto;
        }
        .slide-arrow:hover {
            background: rgba(60,60,80,0.8);
            color: #d0d0d0;
            border-color: #7cb8b8;
        }

        #currentLabel {
            position: fixed;
            bottom: 100px;
            right: 30px;
            color: #444;
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 1001;
            pointer-events: none;
            text-align: right;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.4s;
        }
        #currentLabel.show { opacity: 1; }
        #currentLabel .name { color: #7cb8b8; font-size: 16px; }
        #currentLabel .index { color: #555; font-size: 11px; }

        #pageContent {
            color: #444;
            font-size: 14px;
            padding: 40px;
            text-align: center;
            margin-top: 20vh;
            letter-spacing: 1px;
            line-height: 2;
        }
        #pageContent span { color: #7cb8b8; }

        @media (max-width: 500px) {
            #menuContainer { width: 340px; height: 340px; }
            .menu-item { width: 36px; height: 36px; font-size: 10px; margin-left: -18px; margin-top: -18px; }
            .menu-item.sub { width: 30px; height: 30px; font-size: 9px; margin-left: -15px; margin-top: -15px; }
            .menu-item.sub2 { width: 26px; height: 26px; font-size: 8px; margin-left: -13px; margin-top: -13px; }
            .menu-item.sub3 { width: 22px; height: 22px; font-size: 7px; margin-left: -11px; margin-top: -11px; }
            .slide-arrow { width: 22px; height: 22px; font-size: 11px; }
            #menuTrigger { width: 50px; height: 50px; font-size: 22px; bottom: 20px; right: 20px; }
            #currentLabel { bottom: 80px; right: 20px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="topBarContainer"></div>
    <div id="pageContent"><span>⬡ 环形多级</span><br>悬停展开 · 点击跳转</div>

                    ]
                }, {
                    name: '子项B2',

                        { name: '孙B2a', href: '#' },

                }]

                    ]
                }]
            }],

            menuPosition: 'bottom-left',
            menuOffsetX: 0,
            menuOffsetY: 20,
            
            // 触发按钮位置（独立）
            triggerPosition: 'bottom-left',
            triggerOffsetX: 30,
            triggerOffsetY: -30,
            triggerZindex:999,
            
            // 标签位置（独立）
            labelPosition: 'bottom-left',
            labelOffsetX: 80,
            labelOffsetY: 100,
            
            // 环位置偏移（独立）
            ringOffsetX: 0,
            ringOffsetY: 0,
            menuZIndex: 900,     // 菜单容器
            triggerZIndex: 950,  // 触发按钮
            labelZIndex: 1000    // 标签
        });
    </script>
    <script src="./common.js"></script>
</body>
</html>
