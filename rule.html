    window.PAGE_META.cssFront = ["./css/rule.css"]

  </style>
  <script>
    window.PAGE_META.content =
    `
    <div class="wrap">

      <div class="tag">我的想法 · 规则</div>

      <h1>
        相同约分 + 奇偶转 0/1<br>
        <span class="hl">1 = 0 = 空</span>
      </h1>

      <p class="sub">
        B：数字相同的全部约分，只保留出现 1 次的数字，0 和 1 都丢掉。<br>
        A：大于 1 的数，奇数转 0，偶数转 1；小于等于 1 的数保留，最后 0 和 1 都丢掉。<br>
        规则：1 = 0 = 空。<br>
        最终结果全是空，空 == 空，全部对合。
      </p>

      <div class="section-title">一、规则</div>
      <div class="grid">
        <div class="card">
          <h3><span class="dot gold"></span>B：相同约分</h3>
          <ul>
            <li>统计每个数字出现几次</li>
            <li>出现 1 次的，保留</li>
            <li>出现 2 次及以上的，全部丢掉</li>
            <li>0 和 1 都丢掉</li>
          </ul>
        </div>
        <div class="card">
          <h3><span class="dot green"></span>A：奇偶转 0/1</h3>
          <ul>
            <li>大于 1 的数</li>
            <li>奇数转 0</li>
            <li>偶数转 1</li>
            <li>小于等于 1 的数，保留</li>
            <li>最后 0 和 1 都丢掉</li>
          </ul>
        </div>
        <div class="card">
          <h3><span class="dot blue"></span>空：1 = 0 = 空</h3>
          <ul>
            <li>1 和 0，都算空</li>
            <li>空就约掉</li>
            <li>最后只留非 0、非 1 的数字</li>
          </ul>
        </div>
      </div>

      <div class="section-title">二、测试</div>
      <table class="table">
        <tr><th>原数</th><th>B</th><th>A</th><th>修正之后结果</th></tr>
        <tr><td>2026</td><td>6</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>2000</td><td>2</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>1996</td><td>6</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>1234</td><td>2、3、4</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>2345</td><td>2、3、4、5</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>3456</td><td>3、4、5、6</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>5555</td><td>（空）</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>9090</td><td>（空）</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>1001</td><td>（空）</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>1111</td><td>（空）</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>0000</td><td>（空）</td><td>（空）</td><td>（空）</td></tr>
        <tr><td>9999</td><td>（空）</td><td>（空）</td><td>（空）</td></tr>
      </table>

      <div class="quote" style="margin-top:16px;">
        不管输入什么，最后都归到空。<br>
        归到空，就对上了。<br>
        <span>全部对合</span>
      </div>

      <div class="section-title">三、核心例子</div>
      <div class="quote">
        2026 → B:6 → A:（空）→ 修正:（空）<br>
        2000 → B:2 → A:（空）→ 修正:（空）<br>
        <span>（空）==（空），相等</span>
      </div>

      <div class="section-title">四、结论</div>
      <div class="quote">
        B 相同约分，只留出现 1 次的<br>
        A 奇偶转 0/1，奇转 0，偶转 1<br>
        1 = 0 = 空<br>
        <span>最终结果全是空</span><br>
        空 == 空<br>
        <span>全部对合</span><br>
        要的就是全部对合，不是区分
      </div>

      <div class="end">
        <p>
          <span class="gold">相同约分</span><br>
          <span class="green">奇偶转 0/1</span><br>
          <span class="blue">全部对合</span>
        </p>
        <div class="foot">个人观点 · 欢迎讨论</div>
      </div>

    </div>
    `
